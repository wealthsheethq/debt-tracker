<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debt Tracker</title>
<meta name="description" content="Private debt payoff tracker">
<meta name="theme-color" content="#0E0F12">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0E0F12;
  --surface: #15171C;
  --surface-2: #1D2027;
  --line: #2A2E37;
  --text: #F4F5F7;
  --muted: #9AA1AE;
  --faint: #6B7280;
  --accent: #C6FF3D;
  --accent-ink: #0E0F12;
  --debt: #FF4D6D;
  --good: #C6FF3D;
  --warn: #FFB547;
  --save: #3DD6FF;
  /* chart series (validated for colorblind separation on the dark surface) */
  --plan-a: #E0527A;
  --plan-b: #3197CC;
  --s-debt: #E0527A;
  --s-hysa: #3197CC;
  --b-rent: #C08A1E;
  --b-debt: #E0527A;
  --b-hysa: #3197CC;
  --b-spend: #5E9E2E;
  --b-custom: #9A6ADB;
  --s-invest: #5E9E2E;
  --s-total: #C08A1E;
  --radius: 16px;
  --tab-h: 68px;
  --font-head: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --font-num: 'DM Mono', ui-monospace, Menlo, monospace;
  --font-body: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; letter-spacing: .5px; margin: 0; line-height: 1; }
h1 { font-size: 44px; }
h2 { font-size: 28px; }
h3 { font-size: 22px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background: rgba(14,15,18,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.app-header h1 { font-size: 30px; }
.app-header h1 span { color: var(--accent); }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px); }
.view { display: none; }
.view.active { display: block; animation: fadeIn .18s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.section-title { font-family: var(--font-head); font-size: 34px; margin: 6px 0 12px; }
.section-title em { font-style: normal; color: var(--accent); }

.grid-2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 10px; }

/* ---------- sync pill ---------- */
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-family: var(--font-num);
  padding: 6px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync[data-state="saved"] i { background: var(--good); }
.sync[data-state="syncing"] i { background: var(--warn); animation: pulse 1s infinite; }
.sync[data-state="offline"] i { background: var(--debt); }
.sync[data-state="error"] i { background: var(--debt); }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, minmax(0,1fr));
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(21,23,28,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--faint); font-size: 10.5px; font-weight: 500; cursor: pointer; min-width: 0; padding: 0 1px; white-space: nowrap; overflow: hidden;
}
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.active { color: var(--accent); }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer; text-decoration: none; text-align: center;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--debt); border-color: rgba(255,77,109,.5); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.icon { min-height: 44px; min-width: 44px; padding: 0; font-size: 18px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.field { display: block; margin-bottom: 12px; min-width: 0; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.input, select.input {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px;
  background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 17px;
  appearance: none; -webkit-appearance: none; min-width: 0;
}
.input.num { font-family: var(--font-num); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(198,255,61,.18); }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.prefix { position: relative; min-width: 0; }
.prefix > b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 400; font-family: var(--font-num); pointer-events: none; }
.prefix > .input { padding-left: 30px; }
.suffix { position: relative; min-width: 0; }
.suffix > b { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 400; font-family: var(--font-num); pointer-events: none; }
.suffix > .input { padding-right: 34px; }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: var(--muted); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* ---------- hero / stats ---------- */
.hero { position: relative; overflow: hidden; background: linear-gradient(145deg, #1B1F14 0%, var(--surface) 55%); }
.hero .big { font-family: var(--font-head); font-size: 64px; line-height: .9; color: var(--accent); overflow-wrap: anywhere; }
.hero .label { text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; color: var(--muted); font-weight: 700; }
.progress { position: relative; height: 14px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress > div { height: 100%; background: linear-gradient(90deg, #8BEA12, var(--accent)); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.progress.save > div { background: linear-gradient(90deg, #1FA8D6, var(--save)); }
.progress.util > div { background: var(--muted); }
.progress.util.hot > div { background: var(--debt); }
.progress .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-family: var(--font-num); margin-top: 4px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-num); font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }

/* ---------- plans ---------- */
.plans { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.plan { background: var(--surface-2); border: 2px solid transparent; border-radius: 14px; padding: 12px; min-width: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.plan.on { border-color: var(--accent); }
.plan .tag { font-family: var(--font-head); font-size: 20px; display: flex; align-items: center; gap: 6px; }
.plan .tag i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.plan .date { font-family: var(--font-head); font-size: 32px; line-height: 1; margin: 6px 0 2px; }
.plan .meta { font-size: 12px; color: var(--muted); }
.plan .val { font-family: var(--font-num); font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(198,255,61,.14); color: var(--accent); margin-top: 8px; }
.badge.neg { background: rgba(255,77,109,.14); color: var(--debt); }
.badge.neutral { background: var(--bg); color: var(--muted); }

/* ---------- what-if ---------- */
input[type=range] { width: 100%; height: 44px; background: transparent; accent-color: var(--accent); margin: 4px 0; }
.whatif-out { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; margin-top: 10px; }

/* ---------- timeline ---------- */
.tl-row { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: center; margin-bottom: 10px; }
.tl-rank { font-family: var(--font-head); font-size: 22px; color: var(--accent); text-align: center; }
.tl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
.tl-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tl-top span { font-family: var(--font-num); font-size: 13px; color: var(--muted); white-space: nowrap; }
.tl-track { position: relative; height: 12px; background: var(--bg); border-radius: 999px; }
.tl-bar { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: var(--accent); }
.tl-axis { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-num); color: var(--faint); margin: 2px 0 0 36px; }

/* ---------- charts ---------- */
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 6px 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; margin-bottom: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: nowrap; transform: translateX(-50%); z-index: 2; top: 4px; }
.tip .num { font-size: 12px; }

/* ---------- budget flow ---------- */
.flowbar { display: flex; gap: 2px; height: 26px; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.flowbar > div { height: 100%; min-width: 3px; }
.flow-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; table-layout: fixed; }
.flow-table th { text-align: right; font-weight: 500; color: var(--faint); font-size: 12px; padding: 4px 0; }
.flow-table th:first-child { text-align: left; }
.flow-table td { padding: 8px 0; border-top: 1px solid var(--line); text-align: right; font-family: var(--font-num); font-size: 13px; }
.flow-table td:first-child { text-align: left; font-family: var(--font-body); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-table col.c1 { width: 40%; }
.flow-table col.c4 { width: 13%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
.item-row { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) 44px; gap: 8px; align-items: center; margin-bottom: 4px; }
.item-row .input { min-height: 46px; font-size: 16px; }

/* ---------- debts ---------- */
.debt { position: relative; }
.debt.paid { opacity: .75; }
.debt.urgent { border-color: rgba(255,77,109,.6); }
.debt-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.debt-name { font-family: var(--font-head); font-size: 26px; line-height: 1; overflow-wrap: anywhere; }
.debt-type { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
.debt-bal { font-family: var(--font-num); font-size: 22px; font-weight: 500; text-align: right; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { font-size: 12px; font-family: var(--font-num); padding: 4px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.chip.hot { color: var(--warn); }
.chip.ok { color: var(--accent); }
.chip.bad { color: #FFB3C1; background: rgba(255,77,109,.14); }
.debt-actions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
.stamp { position: absolute; right: 14px; top: 44px; transform: rotate(-10deg); font-family: var(--font-head); font-size: 34px; color: var(--accent); border: 3px solid var(--accent); padding: 0 8px; border-radius: 8px; opacity: .9; }
.util-line { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-family: var(--font-num); flex-wrap: wrap; }

/* custom order */
.order-list { list-style: none; margin: 12px 0 0; padding: 0; }
.order-list li { display: grid; grid-template-columns: 24px minmax(0,1fr) 44px 44px; gap: 6px; align-items: center; padding: 6px; border-radius: 12px; background: var(--surface-2); margin-bottom: 6px; }
.order-list li.dragging { opacity: .4; }
.order-list li.over { outline: 2px dashed var(--accent); }
.order-list .handle { cursor: grab; color: var(--faint); text-align: center; font-size: 18px; user-select: none; }
.order-list .nm { min-width: 0; }
.order-list .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-list .nm span { font-size: 12px; color: var(--muted); font-family: var(--font-num); }

.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist li > div:first-child { min-width: 0; overflow-wrap: anywhere; }
.hist li:last-child { border-bottom: 0; }
.hist .when { font-size: 12px; color: var(--faint); }
.hist .amt { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.amt.pos { color: var(--accent); }
.amt.neg { color: var(--debt); }

/* upcoming */
.up { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.up:first-of-type { border-top: 0; }
.up .d { text-align: center; background: var(--surface-2); border-radius: 10px; padding: 4px 0; line-height: 1.05; }
.up .d b { font-family: var(--font-head); font-size: 24px; display: block; font-weight: 400; }
.up .d span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.up .w { min-width: 0; font-size: 14px; }
.up .w div:first-child { font-weight: 700; overflow-wrap: anywhere; }
.up .w div + div { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.up .a { font-family: var(--font-num); font-size: 14px; text-align: right; white-space: nowrap; }
.up.pay .d b { color: var(--accent); }
.up.due .d b { color: var(--warn); }

/* milestones */
.ms { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.ms-label + .ms { border-top: 0; }
.ms .ico { font-size: 22px; text-align: center; }
.ms .t { min-width: 0; overflow-wrap: anywhere; }
.ms .t div + div { font-size: 12px; color: var(--muted); }
.ms.earned .t div:first-child { color: var(--accent); font-weight: 700; }
.ms .when { font-size: 12px; font-family: var(--font-num); color: var(--muted); text-align: right; white-space: nowrap; }
.ms-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0 2px; }

/* ---------- paychecks ---------- */
.pc { border-left: 3px solid var(--accent); }
.pc.lump { border-left-color: var(--save); }
.pc.urgent { border-left-color: var(--debt); }
.pc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; }
.pc-date { font-family: var(--font-head); font-size: 22px; }
.pc-head .num { white-space: nowrap; }
.pc-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 15px; border-top: 1px dashed var(--line); }
.pc-line:first-of-type { border-top: 0; }
.pc-line span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pc-line .num { white-space: nowrap; }
.pc-line.save { color: var(--save); }
.pc-line.done { color: var(--accent); font-weight: 700; }
.pc-line.urgent { color: #FFB3C1; }

.alert { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; border: 1px solid rgba(255,181,71,.4); background: rgba(255,181,71,.08); color: #FFD9A0; }
.alert.bad { border-color: rgba(255,77,109,.4); background: rgba(255,77,109,.08); color: #FFB3C1; }
.alert .btn { margin-top: 10px; }

.empty { text-align: center; padding: 28px 16px; }
.empty h2 { margin-bottom: 8px; }

/* payday checklist */
.paynow { border-color: rgba(198,255,61,.55); background: linear-gradient(145deg, #1B1F14 0%, var(--surface) 60%); }
.paynow.missed { border-color: rgba(255,181,71,.55); background: var(--surface); }
.cl-row { display: grid; grid-template-columns: 48px minmax(0,1fr) minmax(0,118px); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.cl-row.done .nm b { text-decoration: line-through; color: var(--muted); }
.cl-row .nm { min-width: 0; }
.cl-row .nm b { display: block; overflow-wrap: anywhere; }
.cl-row .nm span { font-size: 12px; color: var(--muted); }
.cl-check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: var(--accent-ink); font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cl-row.done .cl-check { background: var(--accent); }
.cl-row .input { min-height: 44px; font-size: 16px; }
.cl-paid { text-align: right; font-family: var(--font-num); font-size: 15px; }
.cl-paid button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 6px 0 0; min-height: 28px; }

/* recaps & tables */
.recap-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.recap-grid .stat .v { font-size: 16px; }
details.recap { border-top: 1px solid var(--line); padding: 10px 0; }
details.recap:first-of-type { border-top: 0; }
details.recap summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 700; list-style: none; min-height: 32px; align-items: center; }
details.recap summary::-webkit-details-marker { display: none; }
details.recap summary .num { font-weight: 400; font-size: 14px; }

<!-- ================= ENGINE (pure functions, no DOM) ================= -->
<script id="engine">
/* ENGINE START */
const FREQUENCIES = {
  weekly:      { label: 'Weekly',                      perMonth: 52 / 12 },
  biweekly:    { label: 'Every 2 weeks (bi-weekly)',   perMonth: 26 / 12 },
  semimonthly: { label: 'Twice a month (1st & 15th)',  perMonth: 2 },
  monthly:     { label: 'Monthly',                     perMonth: 1 }
};
const STRATEGIES = ['avalanche', 'snowball', 'custom'];

const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
const toNum = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const newId = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function parseISO(s) {
  if (!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
}
function toISO(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function monthKey(d) { return d.getFullYear() * 12 + d.getMonth(); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function addMonthsKeepDay(d, n, day) {
  const y = d.getFullYear(), m = d.getMonth() + n;
  const target = new Date(y, m, 1, 12);
  target.setDate(Math.min(day, daysInMonth(target.getFullYear(), target.getMonth())));
  return target;
}

/** Next paycheck date on/after `from`, given an anchor payday and frequency. */
function firstPaycheckOnOrAfter(anchorISO, freq, from) {
  let anchor = parseISO(anchorISO) || from;
  if (freq === 'weekly' || freq === 'biweekly') {
    const step = freq === 'weekly' ? 7 : 14;
    const diff = Math.round((from - anchor) / 86400000);
    if (diff > 0) anchor = addDays(anchor, Math.ceil(diff / step) * step);
    return anchor;
  }
  if (freq === 'semimonthly') {
    let d = new Date(from.getFullYear(), from.getMonth(), from.getDate() <= 1 ? 1 : 15, 12);
    if (d < from) d = new Date(from.getFullYear(), from.getMonth() + 1, 1, 12);
    return d;
  }
  const day = anchor.getDate();
  let d = addMonthsKeepDay(new Date(from.getFullYear(), from.getMonth(), 1, 12), 0, day);
  if (d < from) d = addMonthsKeepDay(d, 1, day);
  return d;
}
function nextPaycheck(d, freq, anchorDay) {
  if (freq === 'weekly') return addDays(d, 7);
  if (freq === 'biweekly') return addDays(d, 14);
  if (freq === 'semimonthly') return d.getDate() < 15 ? new Date(d.getFullYear(), d.getMonth(), 15, 12) : new Date(d.getFullYear(), d.getMonth() + 1, 1, 12);
  return addMonthsKeepDay(d, 1, anchorDay);
}
/** Next date on/after `from` that falls on day-of-month `day` (clamped to short months). */
function nextDueDate(day, from) {
  let d = addMonthsKeepDay(new Date(from.getFullYear(), from.getMonth(), 1, 12), 0, day);
  if (d < from) d = addMonthsKeepDay(d, 1, day);
  return d;
}

/** Effective APR for a debt during the month that starts on `monthStart`. */
function effectiveApr(debt, monthStart) {
  if (debt.promoEnd && monthStart <= debt.promoEnd) return debt.promoApr || 0;
  return debt.apr;
}
/** The balance a card should stay under: limit minus the amount to keep open. Infinity = no limit set. */
function bufferLine(limit, keepOpen) {
  limit = toNum(limit);
  return limit > 0 ? r2(Math.max(0, limit - Math.max(0, toNum(keepOpen)))) : Infinity;
}

function priorityOrder(debts, strategy, when) {
  const live = debts.filter((d) => d.bal > 0.004);
  const avalanche = (a, b) => (effectiveApr(b, when) - effectiveApr(a, when)) || (b.apr - a.apr) || (a.bal - b.bal) || (a.idx - b.idx);
  if (strategy === 'snowball') return live.sort((a, b) => (a.bal - b.bal) || (b.apr - a.apr) || (a.idx - b.idx));
  if (strategy === 'custom') return live.sort((a, b) => (a.rank - b.rank) || avalanche(a, b));
  // avalanche: highest rate right now first (promo debts count as 0% until the promo ends)
  return live.sort(avalanche);
}

/**
 * Simulate payoff paycheck by paycheck.
 * Model: interest is charged monthly (APR/12 on the balance at the start of each
 * calendar month, 0 while a promo is active). Each paycheck pays, in order:
 *   1. minimums still owed this calendar month,
 *   2. whatever brings any card back under its buffer line (limit - keep-open), flagged urgent,
 *   3. every remaining dollar to the priority debt (avalanche / snowball / custom order),
 *      rolling over as debts close.
 *
 * opts: { perPaycheck, frequency, payAnchor (ISO), today (ISO), strategy, customOrder, lumpSum, maxMonths,
 *         skipThrough (ISO, optional: paydays on/before this date are already handled, e.g. by a payday checklist) }
 */
function simulatePayoff(debtsIn, opts) {
  const today = parseISO(opts.today) || new Date();
  const freq = FREQUENCIES[opts.frequency] ? opts.frequency : 'biweekly';
  const strategy = STRATEGIES.includes(opts.strategy) ? opts.strategy : 'avalanche';
  const customOrder = Array.isArray(opts.customOrder) ? opts.customOrder : [];
  const perPaycheck = Math.max(0, r2(toNum(opts.perPaycheck)));
  const lumpSum = Math.max(0, r2(toNum(opts.lumpSum)));
  const maxMonths = opts.maxMonths || 600;

  const debts = (debtsIn || [])
    .filter((d) => !d.paid && toNum(d.balance) > 0.004)
    .map((d, idx) => {
      const rank = customOrder.indexOf(d.id);
      return {
        id: d.id, name: d.name || 'Debt', idx, rank: rank < 0 ? 1e6 + idx : rank,
        bal: r2(toNum(d.balance)), startBal: r2(toNum(d.balance)),
        apr: Math.max(0, toNum(d.apr)), min: Math.max(0, toNum(d.minPayment)),
        line: bufferLine(d.creditLimit, d.keepOpen),
        promoEnd: parseISO(d.promoEnd), promoApr: Math.max(0, toNum(d.promoApr)), paidOn: null, interest: 0, paidTotal: 0, minDue: 0
      };
    });

  const res = {
    ok: true, strategy, today: toISO(today), totalInterest: 0, totalPaid: 0,
    startTotal: r2(debts.reduce((s, d) => s + d.bal, 0)),
    minTotal: r2(debts.reduce((s, d) => s + d.min, 0)),
    monthlyBudget: r2(perPaycheck * FREQUENCIES[freq].perMonth),
    perPaycheck, debtFree: null, months: 0, payoffs: [], lump: null, paychecks: [], series: [], warnings: [],
    overBuffer: debts.filter((d) => d.bal > d.line + 0.004).map((d) => ({ id: d.id, name: d.name, over: r2(d.bal - d.line) })),
    bufferRestored: {}
  };
  if (!debts.length) { res.debtFree = res.today; return res; }

  let curMonth = monthKey(today);
  debts.forEach((d) => { d.minDue = Math.min(d.min, d.bal); });
  const total = () => r2(debts.reduce((s, d) => s + d.bal, 0));

  const pay = (d, amt, date, allocs, isBuffer) => {
    amt = r2(Math.min(amt, d.bal));
    if (amt <= 0) return 0;
    d.bal = r2(d.bal - amt);
    d.paidTotal = r2(d.paidTotal + amt);
    d.minDue = Math.max(0, r2(d.minDue - amt));
    res.totalPaid = r2(res.totalPaid + amt);
    let a = allocs.find((x) => x.id === d.id);
    if (!a) { a = { id: d.id, name: d.name, amount: 0, buffer: 0 }; allocs.push(a); }
    a.amount = r2(a.amount + amt);
    if (isBuffer) a.buffer = r2(a.buffer + amt);
    if (d.bal <= 0.004 && !d.paidOn) {
      d.bal = 0; d.paidOn = toISO(date);
      res.payoffs.push({ id: d.id, name: d.name, date: d.paidOn, order: res.payoffs.length + 1, interest: r2(d.interest), paid: d.paidTotal });
    }
    if (isBuffer && d.bal <= d.line + 0.004 && !res.bufferRestored[d.id]) res.bufferRestored[d.id] = toISO(date);
    return amt;
  };
  const restoreBuffers = (date, avail, allocs) => {
    for (const d of priorityOrder(debts, strategy, date)) {
      if (avail <= 0) break;
      const need = r2(d.bal - d.line);
      if (need > 0) avail = r2(avail - pay(d, Math.min(need, avail), date, allocs, true));
    }
    return avail;
  };
  const payExtra = (date, avail, allocs) => {
    for (const d of priorityOrder(debts, strategy, date)) {
      if (avail <= 0) break;
      avail = r2(avail - pay(d, avail, date, allocs, false));
    }
    return avail;
  };

  res.series.push({ date: res.today, total: total() });

  // Day 1 lump sum: restore buffers first, then priority order
  if (lumpSum > 0) {
    const allocs = [];
    let avail = restoreBuffers(today, lumpSum, allocs);
    avail = payExtra(today, avail, allocs);
    res.lump = { date: res.today, amount: lumpSum, allocations: allocs, leftover: r2(avail), urgent: allocs.some((a) => a.buffer > 0) };
  }

  let payday = firstPaycheckOnOrAfter(opts.payAnchor, freq, today);
  const anchorDay = (parseISO(opts.payAnchor) || payday).getDate();
  if (opts.skipThrough) while (toISO(payday) <= opts.skipThrough) payday = nextPaycheck(payday, freq, anchorDay);
  const startKey = monthKey(today);

  while (debts.some((d) => d.bal > 0)) {
    // cross calendar-month boundaries: charge interest, reset minimums
    while (monthKey(payday) > curMonth) {
      curMonth += 1;
      const monthStart = new Date(Math.floor(curMonth / 12), curMonth % 12, 1, 12);
      for (const d of debts) {
        if (d.bal <= 0) continue;
        const interest = r2(d.bal * effectiveApr(d, monthStart) / 1200);
        d.bal = r2(d.bal + interest);
        d.interest = r2(d.interest + interest);
        res.totalInterest = r2(res.totalInterest + interest);
        d.minDue = Math.min(d.min, d.bal);
      }
      res.series.push({ date: toISO(monthStart), total: total() });
    }
    if (curMonth - startKey > maxMonths) {
      res.ok = false;
      res.warnings.push('Not paid off within ' + Math.round(maxMonths / 12) + ' years at this payment amount.');
      break;
    }

    const allocs = [];
    let avail = perPaycheck;
    for (const d of priorityOrder(debts, strategy, payday)) {   // 1) minimums still owed this month
      if (avail <= 0) break;
      avail = r2(avail - pay(d, Math.min(d.minDue, avail), payday, allocs, false));
    }
    avail = restoreBuffers(payday, avail, allocs);                // 2) urgent: get back under buffer lines
    avail = payExtra(payday, avail, allocs);                      // 3) everything else, rolling over
    res.paychecks.push({ date: toISO(payday), allocations: allocs, toDebt: r2(perPaycheck - avail), leftover: r2(avail), remaining: total(), urgent: allocs.some((a) => a.buffer > 0) });
    payday = nextPaycheck(payday, freq, anchorDay);
  }

  if (res.ok) {
    const last = res.payoffs.length ? res.payoffs[res.payoffs.length - 1].date : res.today;
    res.debtFree = last;
    res.months = monthKey(parseISO(last)) - startKey;
    const tail = res.series[res.series.length - 1];
    if (tail.date === last) tail.total = 0; else res.series.push({ date: last, total: 0 });
  }
  if (res.monthlyBudget + 0.004 < res.minTotal) {
    res.warnings.unshift(`Your debt budget (~$${res.monthlyBudget.toFixed(2)}/mo) is below the total minimums ($${res.minTotal.toFixed(2)}/mo).`);
  }
  res.debts = debts.map((d) => ({ id: d.id, name: d.name, startBal: d.startBal, interest: d.interest, paidOn: d.paidOn }));
  return res;
}

/**
 * Month-by-month projection for a plan: total debt (from the payoff simulation) and HYSA
 * (monthly compounding + monthly contribution + paycheck money freed up after payoffs).
 * sav: { balance, apy, monthlyContribution, lumpFromSavings }
 */
function projectPlan(plan, sav) {
  const r = Math.pow(1 + toNum(sav.apy) / 100, 1 / 12) - 1;
  const contrib = toNum(sav.monthlyContribution);
  let hysa = toNum(sav.balance);
  if (sav.lumpFromSavings && plan.lump) hysa = Math.max(0, hysa - plan.lump.amount + plan.lump.leftover);
  const series = plan.series.length ? plan.series : [{ date: plan.today, total: 0 }];
  const pts = [];
  let pi = 0, lastGrowth = monthKey(parseISO(plan.today));
  for (const s of series) {
    const d = parseISO(s.date);
    while (pi < plan.paychecks.length && plan.paychecks[pi].date <= s.date) { hysa += plan.paychecks[pi].leftover; pi++; }
    while (monthKey(d) > lastGrowth) { hysa = hysa * (1 + r) + contrib; lastGrowth++; }
    pts.push({ date: s.date, debt: r2(s.total), hysa: r2(hysa) });
  }
  return pts;
}

/** Month-by-month savings growth: monthly compounding, contribution at month end. */
function projectSavings(balance, apy, monthlyContribution, months) {
  const r = Math.pow(1 + toNum(apy) / 100, 1 / 12) - 1;
  let b = toNum(balance);
  for (let i = 0; i < Math.max(0, months); i++) b = b * (1 + r) + toNum(monthlyContribution);
  return r2(b);
}
function monthsToGoal(balance, apy, monthlyContribution, goal) {
  const r = Math.pow(1 + toNum(apy) / 100, 1 / 12) - 1;
  let b = toNum(balance), m = 0;
  if (b >= goal) return 0;
  if (toNum(monthlyContribution) <= 0 && r <= 0) return null;
  while (b < goal && m < 1200) { b = b * (1 + r) + toNum(monthlyContribution); m++; }
  return m >= 1200 ? null : m;
}

/* ---------- saved-data shape & migration ---------- */
function defaultData(todayISO) {
  return {
    version: 3,
    debts: [],
    budget: {
      takeHome: 0, frequency: 'biweekly', payAnchor: todayISO || toISO(new Date()), debtPerPaycheck: 0, savingsPerPaycheck: 0, lumpSum: 0,
      rentReserve: 0, spending: 0, customItems: [], freedLater: {}, lumpFromSavings: false, cardSpending: 0
    },
    strategy: 'avalanche',
    customOrder: [],
    activePlan: 'A',
    savings: { balance: 0, goal: 0, apy: 0, monthlyContribution: null },
    history: [],
    milestones: {},
    customMilestones: [],
    checkins: [],
    baseline: null,
    payChecklists: [],
    checklistSince: null,
    drift: [],
    afterPlan: { monthly: null, rothPct: 100, rothLimit: 7000, annualReturn: 7 },
    monthlySummaries: [],
    monthMarks: {}
  };

/* ---------- local cache ---------- */
const cacheKey = () => 'debt-tracker:v1:' + (S.user ? S.user.id : 'anon');
function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage full or blocked */ } }
function loadCache() {
  const raw = storageGet(cacheKey());
  if (!raw) return false;
  try {
    const c = JSON.parse(raw);
    S.data = normalize(c.data, todayISO());
    S.meta = Object.assign({ updatedAt: null, syncedAt: null, dirty: false }, c.meta || {});
    return true;
  } catch (e) { return false; }
}
function saveCache() { storageSet(cacheKey(), JSON.stringify({ data: S.data, meta: S.meta })); }

/* ---------- sync ---------- */
function setSync(state) {
  if (!navigator.onLine && state !== 'syncing') state = 'offline';
  S.syncState = state;
  const el = $('#sync');
  el.dataset.state = state;
  el.querySelector('span').textContent = { saved: 'Saved', syncing: 'Syncing…', offline: 'Offline', error: 'Sync error' }[state] || state;
}

/** Call after every change to S.data. */
function commit(opts = {}) {
  S.meta.updatedAt = new Date().toISOString();
  S.meta.dirty = true;
  saveCache();
  if (!opts.noRender) render();
  schedulePush();
}
function schedulePush(delay = 900) {
  clearTimeout(S.pushTimer);
  setSync(navigator.onLine ? 'syncing' : 'offline');
  S.pushTimer = setTimeout(push, delay);
}
async function push() {
  if (!S.user || !S.meta.dirty) { if (S.user) setSync('saved'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  if (S.pushing) { schedulePush(500); return; }
  S.pushing = true; setSync('syncing');
  const stamp = S.meta.updatedAt;
  try {
    const { error } = await S.sb.from(TABLE)
      .upsert({ user_id: S.user.id, data: S.data, updated_at: stamp }, { onConflict: 'user_id' });
    if (error) throw error;
    if (S.meta.updatedAt === stamp) { S.meta.dirty = false; }
    S.meta.syncedAt = stamp;
    saveCache();
    setSync(S.meta.dirty ? 'syncing' : 'saved');
    if (S.meta.dirty) schedulePush(300);
  } catch (e) {
    console.warn('push failed', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  } finally { S.pushing = false; }
}
/** Fetch the cloud row; the newer copy (by updated_at) wins. */
async function pull() {
  if (!S.user || S.pulling) return;
  if (!navigator.onLine) { setSync('offline'); return; }
  S.pulling = true;
  if (!S.meta.dirty) setSync('syncing');
  try {
    const { data: row, error } = await S.sb.from(TABLE).select('data, updated_at').eq('user_id', S.user.id).maybeSingle();
    if (error) throw error;
    const localT = S.meta.updatedAt ? Date.parse(S.meta.updatedAt) : 0;
    if (row && Date.parse(row.updated_at) > localT) {
      // cloud copy is newer: take it
      S.data = normalize(row.data, todayISO());
      S.meta = { updatedAt: row.updated_at, syncedAt: row.updated_at, dirty: false };
      clearTimeout(S.pushTimer);
      saveCache();
      if (!isEditing()) render(); else S.pendingRender = true;
      setSync('saved');
    } else if (!row || S.meta.dirty || Date.parse(row.updated_at) < localT) {
      // local copy is newer or cloud row doesn't exist yet
      if (!S.meta.updatedAt) S.meta.updatedAt = new Date().toISOString();
      S.meta.dirty = true; saveCache();
      await push();
    } else {
      setSync('saved');
    }
    setTimeout(housekeeping, 0);
  } catch (e) {
    console.warn('pull failed', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  } finally { S.pulling = false; }
}

const unpaid = () => S.data.debts.filter((d) => !d.paid);
function totals() {
  const debts = S.data.debts;
  const start = r2(debts.reduce((s, d) => s + Math.max(d.startBalance, d.balance), 0));
  const current = r2(debts.reduce((s, d) => s + (d.paid ? 0 : d.balance), 0));
  const paid = r2(Math.max(0, start - current));
  return { start, current, paid, pct: start > 0 ? Math.min(100, (paid / start) * 100) : 0 };
}
function utilization(d) {
  const limit = toNum(d.creditLimit);
  if (!(limit > 0)) return null;
  const bal = d.paid ? 0 : d.balance;
  const line = bufferLine(limit, d.keepOpen);
  return { limit, bal, pct: (bal / limit) * 100, line, linePct: (line / limit) * 100, over: r2(Math.max(0, bal - line)), available: r2(limit - bal) };
}
function overallUtilization() {
  const cards = S.data.debts.map(utilization).filter(Boolean);
  if (!cards.length) return null;
  const limit = cards.reduce((s, c) => s + c.limit, 0), bal = cards.reduce((s, c) => s + c.bal, 0);
  return { limit, bal, pct: (bal / limit) * 100, count: cards.length };
}

function customMilestoneMet(m) {
  const t = totals();

  if (m.type === 'percent') return t.start > 0 && t.pct >= m.value - 1e-9;
  if (m.type === 'debtBelow') return S.data.debts.length > 0 && t.current <= m.value;
  if (m.type === 'hysaAbove') return m.value > 0 && S.data.savings.balance >= m.value;

}
/** Call after user actions (never after loading data). Celebrates anything newly earned. */
function checkMilestones() {

function confetti(count = 220) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#C6FF3D', '#3DD6FF', '#FF4D6D', '#FFB547', '#FFFFFF'];
  const parts = Array.from({ length: count }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 10, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
    c: colors[(Math.random() * colors.length) | 0]
  }));
  const t0 = performance.now();
  (function frame(t) {
    const life = (t - t0) / 3200;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - life); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.r * 2)); ctx.restore();
    }
    if (life < 1) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- inline SVG line charts ---------- */
const CHARTS = {};
/**
 * series: [{ label, color, dash, dots, points: [{ date, v }] }]
 * Returns chart HTML; render() wires hover/touch tooltips afterwards.
 */
function lineChart(id, series, opts = {}) {
  series = series.filter((s) => s.points.length);
  const all = series.flatMap((s) => s.points);
  if (!all.length) return '<p class="muted small">Not enough data yet.</p>';
  const ts = all.map((p) => parseISO(p.date).getTime());
  const t0 = Math.min(...ts);
  let t1 = Math.max(...ts);
  if (t1 - t0 < 86400000 * 20) t1 = t0 + 86400000 * 30;
  const top = Math.max(1, ...all.map((p) => p.v));
  const W = 340, H = opts.height || 180, L = 44, R = 10, T = 16, B = 22;
  const x = (iso) => L + ((parseISO(iso).getTime() - t0) / (t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  const fmtY = (v) => (v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : money0(v));
  const grid = [0, .5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(top * f).toFixed(1)}" y2="${y(top * f).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(top * f) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">${fmtY(top * f)}</text>`).join('');
  const paths = series.map((s) => {
    const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const dots = s.dots ? s.points.map((p) => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('') : '';
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const labels = (opts.endLabels ? series : []).map((s) => {
    const p = s.points[s.points.length - 1];
    return `<text x="${(W - R).toFixed(1)}" y="${Math.max(10, y(p.v) - 8).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="DM Mono, monospace">${esc(s.label)} ${fmtY(p.v)}</text>`;
  }).join('');
  CHARTS[id] = { series, x, t0, t1, W, L, R };
  const legend = `<div class="legend">${series.map((s) => `<span><i class="${s.dash ? 'dash' : ''}" style="border-color:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
  return `${legend}<div class="chart-wrap" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Chart')}">
    ${grid}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">${esc(fmtMonth(toISO(new Date(t0))))}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace" text-anchor="end">${esc(fmtMonth(toISO(new Date(t1))))}</text>
    ${paths}${labels}
    <line class="cx hidden" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
    <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
  </svg><div class="tip hidden"></div></div>`;
}
function wireCharts(root) {
  root.querySelectorAll('[data-chart]').forEach((wrap) => {
    const c = CHARTS[wrap.dataset.chart]; if (!c) return;
    const svg = wrap.querySelector('svg'), hit = wrap.querySelector('.hit'), tip = wrap.querySelector('.tip'), cx = wrap.querySelector('.cx');
    const move = (ev) => {
      const pt = ev.touches ? ev.touches[0] : ev;
      const box = svg.getBoundingClientRect();
      const vx = ((pt.clientX - box.left) / box.width) * c.W;
      const t = c.t0 + ((vx - c.L) / (c.W - c.L - c.R)) * (c.t1 - c.t0);
      let rows = '', snap = null;
      for (const s of c.series) {
        let best = null, bd = Infinity;
        for (const p of s.points) { const dd = Math.abs(parseISO(p.date).getTime() - t); if (dd < bd) { bd = dd; best = p; } }
        if (!best) continue;
        if (!snap || bd < Math.abs(parseISO(snap).getTime() - t)) snap = best.date;
        rows += `<div><span style="color:${s.color}">■</span> ${esc(s.label)} <span class="num">${money0(best.v)}</span> <span class="faint">${esc(fmtDate(best.date, { month: 'short', year: '2-digit' }))}</span></div>`;
      }
      const X = c.x(snap);
      cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.classList.remove('hidden');
      tip.innerHTML = rows;
      tip.classList.remove('hidden');
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = Math.min(Math.max((X / c.W) * box.width, half), box.width - half) + 'px';
    };
    const leave = () => { tip.classList.add('hidden'); cx.classList.add('hidden'); };
    hit.addEventListener('mousemove', move); hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', () => setTimeout(leave, 1800));
  });
}

/* ---------- housekeeping: runs only after a successful sync, so it never races a newer cloud copy ---------- */
function housekeeping() {
  if (!S.user) return;
  const now = new Date().toISOString();
  let changed = ensureMonthlySummary(S.data, now);
  if (ensurePaydayChecklist(now)) changed = true;
  if (!changed) return;
  const editing = isEditing();
  commit({ noRender: editing });
  if (editing) S.pendingRender = true;
}
/** Create the checklist for the most recent payday (today or past) once, from the plan as of that payday. */
function ensurePaydayChecklist(now) {
  const b = S.data.budget, today = todayISO();
  let changed = false;
  if (!S.data.checklistSince) { S.data.checklistSince = today; changed = true; }   // no back-filled checklists from before this feature existed
  if (!(b.debtPerPaycheck > 0 || b.savingsPerPaycheck > 0 || b.rentReserve > 0)) return changed;
  const pd = lastPaydayOnOrBefore(b.payAnchor, b.frequency, parseISO(today));
  if (!pd) return changed;
  const iso = toISO(pd);
  if (iso < S.data.checklistSince || S.data.payChecklists.some((c) => c.date === iso)) return changed;
  const sim = simulatePayoff(S.data.debts, Object.assign(planOpts(0), { today: iso, payAnchor: b.frequency === 'semimonthly' ? b.payAnchor : iso, skipThrough: null }));
  const pc = sim.paychecks.find((x) => x.date === iso) || null;
  const list = buildChecklist(pc, b, iso, now);
  if (!list.items.length) return changed;
  S.data.payChecklists.unshift(list);
  S.data.payChecklists.sort((a, c) => (a.date < c.date ? 1 : -1));
  if (S.data.payChecklists.length > 60) S.data.payChecklists.length = 60;
  return true;
}

let driftCache = { key: '' };
/** This month's new card spending vs. allowance, with the days each overage pushes the debt-free date. */
function driftInfo() {
  const month = monthOf(new Date().toISOString());
  const key = JSON.stringify([S.data.drift.filter((e) => e.month === month), S.data.debts, S.data.budget, S.data.strategy, S.data.customOrder, S.data.activePlan, S.data.payChecklists.map((c) => c.date), todayISO()]);
  if (driftCache.key === key) return driftCache.v;
  const sum = driftSummary(S.data, month);
  const opts = planOpts(S.data.activePlan === 'B' ? S.data.budget.lumpSum : 0);
  const all = {};
  sum.byCard.forEach((c) => { if (c.excess > 0) all[c.debtId] = c.excess; c.days = c.excess > 0 ? driftDelayDays(S.data.debts, opts, { [c.debtId]: c.excess }) : 0; });
  sum.days = sum.excess > 0 ? driftDelayDays(S.data.debts, opts, all) : 0;
  driftCache = { key, v: sum };
  return sum;
}

/** Paydays and card due dates in the next `days` days, with amounts from the active plan. */
function upcomingItems(days = 14) {
  const today = parseISO(todayISO()), end = addDays(today, days);
  const act = activePlan(), b = S.data.budget;
  const items = [];
  let pd = firstPaycheckOnOrAfter(b.payAnchor, b.frequency, today);
  const anchorDay = (parseISO(b.payAnchor) || pd).getDate();
  while (pd <= end) {
    const iso = toISO(pd);
    const pc = act.paychecks.find((p) => p.date === iso);
    const detail = pc && pc.allocations.length ? pc.allocations.map((a) => `${a.name} ${money0(a.amount)}${a.buffer > 0 ? ' ⚠' : ''}`).join(' · ') : '';
    items.push({ kind: 'pay', date: iso, title: 'Payday', detail, amount: pc ? money(pc.toDebt) : (b.takeHome > 0 ? money(b.takeHome) : ''), sub: pc ? 'to debt' : (b.takeHome > 0 ? 'take-home' : '') });
    pd = nextPaycheck(pd, b.frequency, anchorDay);
  }
  for (const d of unpaid()) {
    if (!d.dueDay) continue;
    const due = nextDueDate(d.dueDay, today);
    if (due > end) continue;
    const iso = toISO(due), mk = monthKey(due);
    let planned = act.paychecks.filter((p) => monthKey(parseISO(p.date)) === mk)
      .reduce((s, p) => s + (p.allocations.find((a) => a.id === d.id) || { amount: 0 }).amount, 0);
    if (act.lump && monthKey(parseISO(act.lump.date)) === mk) planned += (act.lump.allocations.find((a) => a.id === d.id) || { amount: 0 }).amount;
    items.push({ kind: 'due', date: iso, title: `${d.name} due`, detail: planned > 0 ? `plan pays ${money(r2(planned))} this month` : 'not in this month\'s plan', amount: money(Math.min(d.minPayment, d.balance)), sub: 'min due' });
  }
  return items.sort((a, c) => (a.date < c.date ? -1 : a.date > c.date ? 1 : a.kind === 'pay' ? -1 : 1));
}

function wireOrderDrag() {
  const list = $('#orderList'); if (!list) return;
  let dragId = null;
  list.querySelectorAll('li').forEach((li) => {
    li.addEventListener('dragstart', (e) => { dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { /* older browsers */ } });
    li.addEventListener('dragend', () => { li.classList.remove('dragging'); list.querySelectorAll('.over').forEach((x) => x.classList.remove('over')); });
    li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', () => li.classList.remove('over'));
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = li.dataset.id;
      if (!dragId || dragId === target) return;
      const orig = effectiveCustomOrder();
      const ids = orig.filter((x) => x !== dragId);
      ids.splice(ids.indexOf(target) + (orig.indexOf(dragId) < orig.indexOf(target) ? 1 : 0), 0, dragId);
      S.data.customOrder = ids; commit();
    });
  });
}

function milestonesHTML() {
  const act = activePlan(), proj = plans().proj, t = totals();
  const etaDebt = (target) => { const p = act.series.find((s) => s.total <= target + 0.004); return p ? p.date : null; };
  const eta = (m) => {
    if (m.type === 'debtPaid') { const po = act.payoffs.find((p) => p.id === m.debtId); return po ? po.date : null; }
    if (m.type === 'percent') return etaDebt(t.start * (1 - m.value / 100));
    if (m.type === 'debtBelow') return etaDebt(m.value);
    if (m.type === 'hysaAbove') { const p = proj.find((q) => q.hysa >= m.value); return p ? p.date : null; }
    return null;
  };
  const describe = (m) => {
    if (m.type === 'debtPaid') { const d = S.data.debts.find((x) => x.id === m.debtId); return `${d ? d.name : 'A deleted debt'} paid off`; }
    if (m.type === 'percent') return `${m.value}% of debt paid`;
    if (m.type === 'debtBelow') return `Total debt under ${money0(m.value)}`;
    return `HYSA reaches ${money0(m.value)}`;
  };
  const rows = MILESTONES.map((m) => {
    const at = S.data.milestones[m];
    return { at, eta: at ? null : etaDebt(t.start * (1 - m / 100)), html: (w) => `<div class="ms ${at ? 'earned' : ''}"><div class="ico">${at ? '✅' : '🎯'}</div>
      <div class="t"><div>${m}% paid off</div><div>Built-in</div></div><div class="when">${w}</div></div>` };
  });
  S.data.customMilestones.forEach((m) => {
    rows.push({ at: m.earnedAt, eta: m.earnedAt ? null : eta(m), html: (w) => `<div class="ms ${m.earnedAt ? 'earned' : ''}"><div class="ico">${m.earnedAt ? '🏆' : '🎁'}</div>
      <div class="t"><div>${esc(m.title)}</div><div>${esc(describe(m))}${m.reward ? ` → ${esc(m.reward)}` : ''}</div></div>
      <div class="when">${w}<div><button class="btn sm ghost" style="min-height:36px;padding:0 8px" data-act="edit-milestone" data-id="${esc(m.id)}">Edit</button></div></div></div>` });
  });
  const up = rows.filter((r) => !r.at).sort((a, b) => ((a.eta || '9999') < (b.eta || '9999') ? -1 : 1));
  const done = rows.filter((r) => r.at).sort((a, b) => (a.at < b.at ? 1 : -1));
  return `<div class="card">
    <div class="card-head"><h3>Milestones</h3><button class="btn sm" data-act="add-milestone">+ Add</button></div>
    <div class="ms-label">Upcoming</div>
    ${up.length ? up.map((r) => r.html(r.eta ? `ETA ${esc(fmtMonth(r.eta))}` : '—')).join('') : '<p class="small muted">All earned. Legend.</p>'}
    ${done.length ? `<div class="ms-label" style="margin-top:14px">Earned</div>${done.map((r) => r.html(esc(fmtDate(String(r.at).slice(0, 10))))).join('')}` : ''}
  </div>`;
}

    else if (e.kind === 'paid') { what = `🎉 PAID OFF · ${esc(e.debtName)}`; amt = `<span class="amt pos">${money(e.amount || 0)}</span>`; }
    else if (e.kind === 'added') { what = `Added · ${esc(e.debtName)}`; amt = `<span class="amt">${money(e.after)}</span>`; }

function snapshotBaseline() {
  const { proj } = plans();
  S.data.baseline = { setAt: new Date().toISOString(), plan: S.data.activePlan, strategy: S.data.strategy, points: proj.slice(0, 361) };

function saveCheckin() {
  const dr = checkinDraft();
  const date = parseISO(dr.date) ? dr.date : todayISO();
  if (!S.data.baseline) snapshotBaseline();   // first check-in: compare against the plan as it stood before it
  const balances = {};
  const newlyPaid = [], drifted = [];
  for (const d of unpaid()) {
    const raw = dr.balances[d.id];
    const v = r2(Math.max(0, toNum(raw != null && raw !== '' ? raw : d.balance)));
    balances[d.id] = v;
    if (recordBalance(S.data, d, v, undefined, 'checkin')) drifted.push(d.name);
    if (v <= 0) newlyPaid.push(d);
  }
  const hysa = r2(Math.max(0, toNum(dr.hysa != null && dr.hysa !== '' ? dr.hysa : S.data.savings.balance)));
  S.data.savings.balance = hysa;
  newlyPaid.forEach((d) => { d.paid = true; d.paidAt = new Date().toISOString(); logHistory({ kind: 'paid', debtId: d.id, debtName: d.name, amount: 0, before: 0, after: 0 }); });
  const totalDebt = r2(S.data.debts.reduce((s, d) => s + (d.paid ? 0 : d.balance), 0));
  S.data.checkins = S.data.checkins.filter((c) => c.date !== date);
  S.data.checkins.push({ id: uid(), date, at: new Date().toISOString(), balances, totalDebt, hysa });
  S.data.checkins.sort((a, b) => (a.date < b.date ? -1 : 1));
  logHistory({ kind: 'checkin', after: totalDebt, hysa });
  S.checkinDraft = null;
  commit();
  window.scrollTo(0, 0);
  if (newlyPaid.length) { confetti(260); toast(`${newlyPaid.map((d) => d.name.toUpperCase()).join(' & ')} PAID!`, 'Rolling that payment forward. 🔥'); }
  else if (drifted.length) driftToast(drifted);
  else toast('CHECK-IN SAVED', `Total debt ${money0(totalDebt)} · HYSA ${money0(hysa)}`, 'info');
  setTimeout(checkMilestones, 900);
}

/* ---------- calendar export ---------- */
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
/** Fold lines at 75 octets (RFC 5545) without splitting multi-byte characters. */
function icsFold(line) {
  const enc = new TextEncoder();
  const out = [];
  let cur = '', bytes = 0;
  for (const ch of line) {
    const n = enc.encode(ch).length;
    if (bytes + n > 74) { out.push(cur); cur = ' '; bytes = 1; }
    cur += ch; bytes += n;
  }
  out.push(cur);
  return out.join('\r\n');
}
function monthDayRule(day) {
  if (day <= 28) return `BYMONTHDAY=${day}`;
  const days = [];
  for (let i = 28; i <= day; i++) days.push(i);
  return `BYMONTHDAY=${days.join(',')};BYSETPOS=-1`;   // the day, or the month's last day if it's shorter
}
function buildICS() {
  const b = S.data.budget, act = activePlan();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const dt = (iso) => iso.replace(/-/g, '');
  const events = [];
  const add = (id, startISO, summary, desc, rrule, alarmDays) => {
    events.push(['BEGIN:VEVENT', `UID:${id}@debt-tracker`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dt(startISO)}`, `DTEND;VALUE=DATE:${dt(toISO(addDays(parseISO(startISO), 1)))}`,
      `SUMMARY:${icsEscape(summary)}`, `DESCRIPTION:${icsEscape(desc)}`, rrule ? `RRULE:${rrule}` : null,
      ...(alarmDays ? ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(summary)}`, `TRIGGER:-P${alarmDays}D`, 'END:VALARM'] : []),
      'END:VEVENT'].filter(Boolean));
  };
  const today = parseISO(todayISO());
  const firstPay = firstPaycheckOnOrAfter(b.payAnchor, b.frequency, today);
  const payRule = { weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', semimonthly: 'FREQ=MONTHLY;BYMONTHDAY=1,15', monthly: 'FREQ=MONTHLY;' + monthDayRule(firstPay.getDate()) }[b.frequency];
  const split = budgetItems().filter((i) => i.amount > 0).map((i) => `${i.name}: ${money(i.amount)}`).join('\n');
  add('payday', toISO(firstPay), '💵 Payday', `Take-home ${money(b.takeHome)}\n${split}\nOpen Debt Tracker → Paychecks to see exactly which card gets what.\n${SITE_URL}`, payRule, 0);
  for (const d of unpaid()) {
    if (!d.dueDay) continue;
    const first = nextDueDate(d.dueDay, today);
    const po = act.payoffs.find((p) => p.id === d.id);
    const until = po ? `;UNTIL=${dt(toISO(nextDueDate(d.dueDay, parseISO(po.date))))}` : '';
    add(`due-${d.id}`, toISO(first), `📅 ${d.name} payment due`,
      `Minimum ${money(d.minPayment)}.${po ? ` Planned payoff: ${fmtMonth(po.date)}.` : ''}\nCheck Debt Tracker for this month's planned amount.\n${SITE_URL}`,
      `FREQ=MONTHLY;${monthDayRule(d.dueDay)}${until}`, 2);
  }
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Debt Tracker//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Debt Tracker', ...events.flat(), 'END:VCALENDAR'];
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function downloadFile(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- events ---------- */
function setPath(path, raw) {
  const [obj, key] = path.split('.');
  const target = S.data[obj];
  if (key === 'frequency') target[key] = FREQUENCIES[raw] ? raw : 'biweekly';
  else if (key === 'payAnchor') target[key] = parseISO(raw) ? raw : todayISO();
  else if (key === 'monthlyContribution' || (obj === 'afterPlan' && key === 'monthly')) target[key] = raw === '' ? null : Math.max(0, toNum(raw));
  else if (obj === 'afterPlan' && key === 'rothPct') target[key] = Math.min(100, Math.max(0, toNum(raw)));
  else if (obj === 'afterPlan' && key === 'annualReturn') target[key] = raw === '' ? 7 : Math.min(30, Math.max(-20, toNum(raw)));
  else target[key] = Math.max(0, key === 'apy' ? toNum(raw) : r2(toNum(raw)));
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-bind]')) { setPath(t.dataset.bind, t.value); commit(); return; }
  if (t.matches('[data-bind-check]')) { const [o, k] = t.dataset.bindCheck.split('.'); S.data[o][k] = t.checked; commit(); return; }
  if (t.matches('[data-freed]')) {
    const key = t.dataset.freed, ci = S.data.budget.customItems.find((i) => i.id === key);
    if (ci) ci.freedLater = t.checked; else S.data.budget.freedLater[key] = t.checked;
    commit(); return;
  }
  if (t.matches('[data-item]')) {
    const ci = S.data.budget.customItems.find((i) => i.id === t.dataset.item);
    if (!ci) return;
    if (t.dataset.field === 'name') ci.name = t.value.trim().slice(0, 40) || 'Item';
    else ci.amount = r2(Math.max(0, toNum(t.value)));
    commit();
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'wiRange') { S.whatIf = toNum(t.value); updateWhatIf(); return; }
  if (t.matches('[data-cl-amt]')) { S.clDraft[t.dataset.clAmt] = t.value; return; }
  if (t.matches('[data-bt]')) { S.bt[t.dataset.bt] = t.dataset.bt === 'debtId' ? t.value : toNum(t.value); updateBT(); return; }
  if (t.matches('[data-ci]')) {
    const dr = checkinDraft();
    if (t.dataset.ci === 'debt') dr.balances[t.dataset.id] = t.value;
    else dr[t.dataset.ci] = t.value;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-bind], [data-item]')) e.target.blur();
  if (e.key === 'Escape' && $('#sheetRoot').firstChild) closeSheet();
});

document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('#tabbar button');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const debt = b.dataset.id ? S.data.debts.find((d) => d.id === b.dataset.id) : null;
  switch (act) {
    case 'goto': switchTab(b.dataset.tab); break;
    case 'add-debt': debtForm(null); break;
    case 'edit-debt': if (debt) debtForm(debt); break;
    case 'delete-debt':
      if (debt && confirm(`Delete "${debt.name}"? This can't be undone.`)) {
        S.data.debts = S.data.debts.filter((d) => d !== debt);
        S.data.customOrder = S.data.customOrder.filter((id) => id !== debt.id);
        logHistory({ kind: 'removed', debtId: debt.id, debtName: debt.name });
        S.checkinDraft = null;
        commit();
      }
      break;
    case 'log-payment': if (debt) amountSheet(debt, 'payment'); break;
    case 'update-balance': if (debt) amountSheet(debt, 'balance'); break;
    case 'mark-paid': if (debt && confirm(`Mark "${debt.name}" as PAID OFF?`)) markPaid(debt); break;
    case 'unpay':
      if (debt) {
        const last = S.data.history.find((h) => h.kind === 'paid' && h.debtId === debt.id);
        debt.paid = false; debt.paidAt = null; debt.balance = last && last.before ? last.before : debt.balance;
        S.checkinDraft = null;
        commit();
      }
      break;
    case 'strategy':
      S.data.strategy = b.dataset.v;
      if (b.dataset.v === 'custom' && !S.data.customOrder.length) S.data.customOrder = priorityOrderIds('avalanche');
      commit();
      break;
    case 'move': {
      const ids = effectiveCustomOrder(), i = ids.indexOf(b.dataset.id), j = i + toNum(b.dataset.dir);
      if (i < 0 || j < 0 || j >= ids.length) break;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      S.data.customOrder = ids; commit();
      const again = document.querySelector(`[data-act="move"][data-id="${CSS.escape(b.dataset.id)}"][data-dir="${b.dataset.dir}"]`);
      if (again && !again.disabled) again.focus();
      break;
    }
    case 'plan': S.data.activePlan = b.dataset.plan; commit(); break;
    case 'toggle-history': S.showAllHistory = !S.showAllHistory; render(); break;
    case 'more-paychecks': S.showAllPaychecks += 52; render(); break;
    case 'add-item': S.data.budget.customItems.push({ id: uid(), name: 'New item', amount: 0, freedLater: false }); commit(); break;
    case 'del-item': S.data.budget.customItems = S.data.budget.customItems.filter((i) => i.id !== b.dataset.id); commit(); break;
    case 'add-milestone': milestoneForm(null); break;
    case 'edit-milestone': { const m = S.data.customMilestones.find((x) => x.id === b.dataset.id); if (m) milestoneForm(m); break; }
    case 'reset-baseline':
      if (confirm('Compare future check-ins against your current plan instead? Past check-ins stay saved.')) { snapshotBaseline(); commit(); }
      break;
    case 'export-ics':
      downloadFile('debt-tracker-reminders.ics', buildICS(), 'text/calendar');
      toast('CALENDAR FILE READY', 'Open it to add paydays and due dates to your calendar.', 'info');
      break;
    case 'sync-now': pull(); break;
    case 'sign-out': signOut(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'cl-check': payChecklistItem(b.dataset.date, b.dataset.key); break;
    case 'cl-undo':
      if (uncheckChecklistItem(S.data, b.dataset.date, b.dataset.key)) { S.checkinDraft = null; commit(); toast('UNDONE', 'Balance put back.', 'info'); }
      break;
    case 'cl-dismiss': { const c = S.data.payChecklists.find((x) => x.date === b.dataset.date); if (c) { c.dismissed = true; commit(); } break; }
    case 'dismiss-summary': { const sm = S.data.monthlySummaries.find((x) => x.month === b.dataset.month); if (sm) { sm.dismissed = true; commit(); } break; }
  }
});
$('#sync').addEventListener('click', () => pull());

function payChecklistItem(date, key) {
  const list = S.data.payChecklists.find((c) => c.date === date);
  const item = list && list.items.find((i) => i.key === key);
  if (!item) return;
  const draft = S.clDraft[`${date}|${key}`];
  const amount = draft != null && draft !== '' ? toNum(draft) : item.planned;
  const res = checkChecklistItem(S.data, date, key, amount);
  if (!res.ok) return;
  delete S.clDraft[`${date}|${key}`];
  S.checkinDraft = null;
  commit();
  if (res.paidOff) { confetti(260); toast(`${res.paidOff.name.toUpperCase()} IS PAID!`, 'Rolling that payment forward. 🔥'); }
  if (res.complete) { setTimeout(() => { confetti(320); toast('PAYCHECK DONE ✅', `All ${plural(list.items.length, 'payment')} made. Nice work.`); }, res.paidOff ? 900 : 0); }
  else if (!res.paidOff) {
    const debt = item.kind === 'debt' ? S.data.debts.find((d) => d.id === item.debtId) : null;
    toast(item.kind === 'hysa' ? `+${money0(res.item.paid)} TO HYSA` : `${money0(res.item.paid)} → ${item.label.toUpperCase()}`,
      debt ? `Balance now ${money(debt.balance)}` : item.kind === 'hysa' ? `Savings now ${money(S.data.savings.balance)}` : 'Marked done', 'info');
  }
  setTimeout(checkMilestones, 1200);
}

/** Starting point for a new custom order: the current order of another strategy. */
function priorityOrderIds(strategy) {
  const p = simulatePayoff(S.data.debts, planOpts(0, 0, strategy));
  const ids = p.payoffs.map((x) => x.id);
  unpaid().forEach((d) => { if (!ids.includes(d.id)) ids.push(d.id); });
  return ids;
}

function exportData() {
  const payload = { app: 'debt-tracker', exportedAt: new Date().toISOString(), data: S.data };
  downloadFile(`debt-tracker-${todayISO()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('EXPORTED', 'Backup file downloaded.', 'info');
}
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const raw = parsed && parsed.data && typeof parsed.data === 'object' && !Array.isArray(parsed.data) ? parsed.data : parsed;
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.debts)) throw new Error('No debts found in that file.');
    if (!confirm(`Import ${plural(raw.debts.length, 'debt')}? This replaces all current data.`)) return;
    S.data = normalize(raw, todayISO());
    S.checkinDraft = null;
    commit();
    toast('IMPORTED', 'Your data was restored.', 'info');
  } catch (err) {
    alert('Import failed: ' + (err && err.message ? err.message : err));
  }
});

/* ---------- auth & boot ---------- */
function show(which) {
  $('#boot').classList.toggle('hidden', which !== 'boot');
  $('#auth').classList.toggle('hidden', which !== 'auth');
  $('#app').classList.toggle('hidden', which !== 'app');
}
function redirectUrl() {
  return location.hostname.endsWith('github.io') || location.protocol === 'file:' ? SITE_URL : location.origin + location.pathname;
}
$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#authEmail').value.trim();
  const btn = $('#authBtn'), msg = $('#authMsg');
  btn.disabled = true; btn.textContent = 'Sending…'; msg.style.color = '';
  try {
    const { error } = await S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectUrl() } });
    if (error) throw error;
    msg.innerHTML = `Check <b>${esc(email)}</b> for your sign-in link. Open it on this device.`;
    msg.style.color = 'var(--accent)';
  } catch (err) {
    msg.textContent = 'Could not send link: ' + (err.message || err);
    msg.style.color = 'var(--debt)';
  } finally { btn.disabled = false; btn.textContent = 'Send magic link'; }
});

async function signOut() {
  if (!confirm('Sign out? Your data stays saved in the cloud.')) return;
  if (S.meta.dirty) await push();
  await S.sb.auth.signOut();
}

function startApp(user) {
  const sameUser = S.user && S.user.id === user.id;
  S.user = user;
  if (!sameUser) {
    S.data = blank(); S.meta = { updatedAt: null, syncedAt: null, dirty: false };
    S.checkinDraft = null;
    loadCache();
    const t = storageGet('debt-tracker:tab');
    if (t && TABS.includes(t)) S.tab = t;
  }
  show('app');
  render();
  setSync(S.meta.dirty ? 'syncing' : 'saved');
  pull();
}
function stopApp() {
  S.user = null; clearTimeout(S.pushTimer);
  S.data = blank(); S.meta = { updatedAt: null, syncedAt: null, dirty: false };
  S.checkinDraft = null;
  show('auth');
}

async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#boot').textContent = navigator.onLine ? 'COULD NOT LOAD SUPABASE' : 'OFFLINE — CONNECT ONCE TO SIGN IN';
    return;
  }
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('PASTE_')) {
    $('#boot').innerHTML = '<div style="padding:24px;text-align:center">SETUP NEEDED<div style="font-family:var(--font-body);font-size:15px;margin-top:8px">Paste your Supabase anon key into <code>SUPABASE_ANON_KEY</code> in index.html.</div></div>';
    return;
  }
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'debt-tracker-auth' }
  });
  const hashErr = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
  S.sb.auth.onAuthStateChange((event, session) => {
    // defer so we never call Supabase from inside the auth callback
    setTimeout(() => {
      if (session && session.user) { if (!S.user || S.user.id !== session.user.id) startApp(session.user); }
      else if (event === 'SIGNED_OUT' || !S.user) stopApp();
    }, 0);
  });
  const { data } = await S.sb.auth.getSession();
  if (data && data.session) {
    if (!S.user) startApp(data.session.user);
    if (location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  } else {
    stopApp();
    if (hashErr) { $('#authMsg').textContent = hashErr.replace(/\+/g, ' '); $('#authMsg').style.color = 'var(--debt)'; }
  }
}

window.addEventListener('online', () => { if (S.user) { setSync('syncing'); pull(); } });
window.addEventListener('offline', () => setSync('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) pull(); else if (S.meta.dirty) push(); });
window.addEventListener('focus', () => { if (S.user) pull(); });
window.addEventListener('pagehide', () => { if (S.meta.dirty) push(); });
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender && !isEditing()) render(); }, 0); });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
