        dueDay: due >= 1 && due <= 31 ? due : null
      };
      if (isNew) {
        const nd = Object.assign({ id: uid(), startBalance: vals.balance, paid: vals.balance <= 0, paidAt: null, createdAt: new Date().toISOString() }, vals);
        S.data.debts.push(nd);
        logHistory({ kind: 'added', debtId: nd.id, debtName: nd.name, after: nd.balance });
      } else {
        d = S.data.debts.find((x) => x.id === d.id);  // data may have been refreshed from the cloud meanwhile
        if (!d) { closeSheet(); return; }
        const drift = recordBalance(S.data, d, vals.balance, undefined, 'edit');
        const start = d.startBalance;
        Object.assign(d, vals);
        d.startBalance = r2(Math.max(0, toNum(f.startBalance.value || start)));
        if (drift) setTimeout(() => driftToast([d.name]), 50);
      }
      S.checkinDraft = null;
      closeSheet();
      commit();
      checkMilestones();
    });
  });
}

function amountSheet(d, mode) {
  const title = mode === 'payment' ? 'Log a payment' : 'Update balance';
  openSheet(`
    <h2 style="margin-bottom:4px">${title}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(d.name)} · current <span class="num">${money(d.balance)}</span></p>
    <form id="amtForm">
      <label class="field"><span>${mode === 'payment' ? 'Payment amount' : 'New balance (from your statement or app)'}</span>
        <div class="prefix"><b>${cur()}</b><input class="input num" name="amt" type="number" inputmode="decimal" min="0" step="0.01" required></div></label>
      <div class="grid-2"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>
    </form>`, (root) => {
    const f = $('#amtForm', root);
    setTimeout(() => f.amt.focus(), 50);
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      d = S.data.debts.find((x) => x.id === d.id);
      if (!d) { closeSheet(); return; }
      const v = r2(Math.max(0, toNum(f.amt.value)));
      const before = d.balance;
      let drifted = false;
      if (mode === 'payment') {
        if (v <= 0) return;
        d.balance = r2(Math.max(0, d.balance - v));
        logHistory({ kind: 'payment', debtId: d.id, debtName: d.name, amount: v, before, after: d.balance });
      } else if (recordBalance(S.data, d, v, undefined, 'update')) {
        drifted = true;
      }
      S.checkinDraft = null;
      closeSheet();
      if (d.balance <= 0) { markPaid(d); return; }
      if (drifted) { commit(); driftToast([d.name]); checkMilestones(); return; }
      toast(mode === 'payment' ? 'PAYMENT LOGGED' : 'BALANCE UPDATED', `${d.name}: ${money(d.balance)} left`, 'info');
      commit();
      checkMilestones();
    });
  });
}

function milestoneForm(m) {
  const isNew = !m;
  m = m || { title: '', reward: '', type: 'debtPaid', debtId: (unpaid()[0] || S.data.debts[0] || {}).id || null, value: '' };
  const debtOpts = S.data.debts.map((d) => `<option value="${esc(d.id)}" ${d.id === m.debtId ? 'selected' : ''}>${esc(d.name)}${d.paid ? ' (paid)' : ''}</option>`).join('');
  openSheet(`
    <h2 style="margin-bottom:14px">${isNew ? 'New milestone' : 'Edit milestone'}</h2>
    <form id="msForm">
      <label class="field"><span>Milestone</span><input class="input" name="title" required maxlength="80" value="${esc(m.title)}" placeholder="e.g. Apple Card gone"></label>
      <label class="field"><span>Reward <span class="faint">(optional)</span></span><input class="input" name="reward" maxlength="120" value="${esc(m.reward)}" placeholder="e.g. Treat under $50"></label>
      <label class="field"><span>Earned when…</span><select class="input" name="type">
        <option value="debtPaid" ${m.type === 'debtPaid' ? 'selected' : ''}>A specific debt is paid off</option>
        <option value="percent" ${m.type === 'percent' ? 'selected' : ''}>% of total debt paid reaches…</option>
        <option value="debtBelow" ${m.type === 'debtBelow' ? 'selected' : ''}>Total debt drops below…</option>
        <option value="hysaAbove" ${m.type === 'hysaAbove' ? 'selected' : ''}>HYSA balance reaches…</option>
      </select></label>
      <label class="field" id="msDebt"><span>Debt</span><select class="input" name="debtId">${debtOpts || '<option value="">No debts yet</option>'}</select></label>
      <label class="field" id="msValue"><span id="msValueLabel">Value</span><input class="input num" name="value" type="number" inputmode="decimal" min="0" step="0.01" value="${m.value || ''}"></label>
      <div class="grid-2" style="margin-top:6px">
        ${isNew ? '<button type="button" class="btn" data-close>Cancel</button>' : '<button type="button" class="btn danger" id="msDelete">Delete</button>'}
        <button type="submit" class="btn primary">${isNew ? 'Add' : 'Save'}</button>
      </div>
      ${!isNew && m.earnedAt ? '<button type="button" class="btn ghost block" id="msReset" style="margin-top:8px">Mark as not earned yet</button>' : ''}
    </form>`, (root) => {
    const f = $('#msForm', root);
    const syncFields = () => {
      const t = f.type.value;
      $('#msDebt', root).classList.toggle('hidden', t !== 'debtPaid');
      $('#msValue', root).classList.toggle('hidden', t === 'debtPaid');
      $('#msValueLabel', root).textContent = t === 'percent' ? 'Percent paid (%)' : t === 'debtBelow' ? 'Total debt below ($)' : 'HYSA balance ($)';
    };
    f.type.addEventListener('change', syncFields); syncFields();
    const del = $('#msDelete', root);
    if (del) del.addEventListener('click', () => { closeSheet(); undoable('MILESTONE DELETED', m.title, () => { S.data.customMilestones = S.data.customMilestones.filter((x) => x.id !== m.id); }); });
    const reset = $('#msReset', root);
    if (reset) reset.addEventListener('click', () => { const x = S.data.customMilestones.find((y) => y.id === m.id); if (x) x.earnedAt = null; closeSheet(); commit(); });
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const vals = { title: f.title.value.trim().slice(0, 80) || 'Milestone', reward: f.reward.value.trim().slice(0, 120), type: f.type.value, debtId: f.debtId.value || null, value: Math.max(0, toNum(f.value.value)) };
      if (vals.type === 'debtPaid' && !vals.debtId) { alert('Add a debt first.'); return; }
      if (vals.type !== 'debtPaid' && !(vals.value > 0)) { alert('Enter a value above 0.'); return; }
      if (isNew) S.data.customMilestones.push(Object.assign({ id: uid(), earnedAt: null, createdAt: new Date().toISOString() }, vals));
      else { const x = S.data.customMilestones.find((y) => y.id === m.id); if (x) Object.assign(x, vals); }
      closeSheet();
      commit();
      checkMilestones();
    });
  });
}

function markPaid(d) {
  const before = d.balance;
  d.paid = true; d.paidAt = new Date().toISOString(); d.balance = 0;
  logHistory({ kind: 'paid', debtId: d.id, debtName: d.name, amount: before, before, after: 0 });
  S.checkinDraft = null;
  commit();
  confetti(260);
  const left = unpaid().length;
  toast(`${d.name.toUpperCase()} IS PAID!`, left ? `${plural(left, 'debt')} to go. Rolling that payment forward. 🔥` : 'That was the last one!');
  setTimeout(checkMilestones, 900);
}

/* ---------- events ---------- */
function setPath(path, raw) {
  const [obj, key] = path.split('.');
  const target = S.data[obj];
  if (key === 'frequency') target[key] = FREQUENCIES[raw] ? raw : 'biweekly';
  else if (key === 'payAnchor') target[key] = parseISO(raw) ? raw : todayISO();
  else if (key === 'monthlyContribution' || (obj === 'afterPlan' && key === 'monthly')) target[key] = raw === '' ? null : Math.max(0, toNum(raw));
  else if (obj === 'afterPlan' && key === 'rothPct') target[key] = Math.min(100, Math.max(0, toNum(raw)));
  else if (obj === 'afterPlan' && key === 'annualReturn') target[key] = raw === '' ? 7 : Math.min(30, Math.max(-20, toNum(raw)));
  else if (obj === 'home') {
    const nullable = ['priceMin', 'priceMax', 'ratePct', 'taxRatePct', 'insuranceYr', 'grossIncomeYr', 'monthlyExpenses', 'creditScore'];
    if (raw === '' && nullable.includes(key)) target[key] = null;
    else if (key === 'termYears') target[key] = Math.max(1, Math.round(toNum(raw)) || 30);
    else target[key] = Math.max(0, toNum(raw));
  }
  else target[key] = Math.max(0, key === 'apy' ? toNum(raw) : r2(toNum(raw)));
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-bind]')) { setPath(t.dataset.bind, t.value); commit(); return; }
  if (t.matches('[data-bind-check]')) { const [o, k] = t.dataset.bindCheck.split('.'); S.data[o][k] = t.checked; commit(); return; }
  if (t.matches('[data-setting]')) {
    const k = t.dataset.setting;
    S.data.settings[k] = k === 'reduceMotion' ? t.checked : t.value;
    Object.keys(NUMFMT).forEach((x) => delete NUMFMT[x]);
    commit(); return;
  }
  if (t.matches('[data-sp]')) { S.data.spendProfile[t.dataset.sp] = r2(Math.max(0, toNum(t.value))); commit(); return; }
  if (t.matches('[data-freed]')) {
    const key = t.dataset.freed, ci = S.data.budget.customItems.find((i) => i.id === key);
    if (ci) ci.freedLater = t.checked; else S.data.budget.freedLater[key] = t.checked;
    commit(); return;
  }
  if (t.matches('[data-item]')) {
    const ci = S.data.budget.customItems.find((i) => i.id === t.dataset.item);
    if (!ci) return;
    if (t.dataset.field === 'name') ci.name = t.value.trim().slice(0, 40) || 'Item';
    else ci.amount = r2(Math.max(0, toNum(t.value)));
    commit();
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'wiRange') { S.whatIf = toNum(t.value); updateWhatIf(); return; }
  if (t.id === 'wbQuery') { S.wb.query = t.value; updateWhichCard(); document.querySelectorAll('#whichCard [data-act="wb-cat"]').forEach((x) => x.classList.toggle('on', SPEND_CATEGORIES[x.dataset.v] === t.value)); return; }
  if (t.id === 'wbAmt') { S.wb.amount = t.value; updateWhichCard(); return; }
  if (t.id === 'gsearch') { S.gq = t.value; updateSearch(); return; }
  if (t.matches('[data-cl-amt]')) { S.clDraft[t.dataset.clAmt] = t.value; return; }
  if (t.matches('[data-bt]')) { S.bt[t.dataset.bt] = t.dataset.bt === 'debtId' ? t.value : toNum(t.value); updateBT(); return; }
  if (t.matches('[data-ci]')) {
    const dr = checkinDraft();
    if (t.dataset.ci === 'debt') dr.balances[t.dataset.id] = t.value;
    else if (t.dataset.ci === 'acct') dr.accounts[t.dataset.id] = t.value;
    else dr[t.dataset.ci] = t.value;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-bind], [data-item]')) e.target.blur();
  if (e.key === 'Escape' && $('#sheetRoot').firstChild) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act], [role="link"][data-act], [role="option"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.target.id === 'gsearch') {
    if (e.key === 'Enter') { const r = searchResults(S.gq)[0]; if (r) { e.preventDefault(); searchGo(r.kind, r.id); } }
    if (e.key === 'Escape') { S.gq = ''; e.target.value = ''; updateSearch(); }
    if (e.key === 'ArrowDown') { const f = $('#gsOut [role="option"]'); if (f) { e.preventDefault(); f.focus(); } }
  }
});

document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('#tabbar button');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }
  const subBtn = e.target.closest('#subnav button');
  if (subBtn) { switchTab('debt', subBtn.dataset.sub); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const debt = b.dataset.id ? S.data.debts.find((d) => d.id === b.dataset.id) : null;
  switch (act) {
    case 'goto': switchTab(b.dataset.tab); break;
    case 'add-debt': debtForm(null); break;
    case 'edit-debt': if (debt) debtForm(debt); break;
    case 'delete-debt':
      if (debt) undoable('DEBT DELETED', debt.name, () => {
        S.data.debts = S.data.debts.filter((d) => d !== debt);
        S.data.customOrder = S.data.customOrder.filter((id) => id !== debt.id);
        logHistory({ kind: 'removed', debtId: debt.id, debtName: debt.name });
      });
      break;
    case 'log-payment': if (debt) amountSheet(debt, 'payment'); break;
    case 'update-balance': if (debt) amountSheet(debt, 'balance'); break;
    case 'mark-paid': if (debt && confirm(`Mark "${debt.name}" as PAID OFF?`)) markPaid(debt); break;
    case 'unpay':
      if (debt) {
        const last = S.data.history.find((h) => h.kind === 'paid' && h.debtId === debt.id);
        debt.paid = false; debt.paidAt = null; debt.balance = last && last.before ? last.before : debt.balance;
        S.checkinDraft = null;
        commit();
      }
      break;
    case 'strategy':
      S.data.strategy = b.dataset.v;
      if (b.dataset.v === 'custom' && !S.data.customOrder.length) S.data.customOrder = priorityOrderIds('avalanche');
      commit();
      break;
    case 'move': {
      const ids = effectiveCustomOrder(), i = ids.indexOf(b.dataset.id), j = i + toNum(b.dataset.dir);
      if (i < 0 || j < 0 || j >= ids.length) break;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      S.data.customOrder = ids; commit();
      const again = document.querySelector(`[data-act="move"][data-id="${CSS.escape(b.dataset.id)}"][data-dir="${b.dataset.dir}"]`);
      if (again && !again.disabled) again.focus();
      break;
    }
    case 'plan': S.data.activePlan = b.dataset.plan; commit(); break;
    case 'toggle-history': S.showAllHistory = !S.showAllHistory; render(); break;
    case 'more-paychecks': S.showAllPaychecks += 52; render(); break;
    case 'add-item': S.data.budget.customItems.push({ id: uid(), name: 'New item', amount: 0, freedLater: false }); commit(); break;
    case 'del-item': { const it = S.data.budget.customItems.find((i) => i.id === b.dataset.id); if (it) undoable('ITEM REMOVED', it.name, () => { S.data.budget.customItems = S.data.budget.customItems.filter((i) => i !== it); }); break; }
    case 'onboard': closeSheet(); openOnboarding(); break;
    case 'ob-next': S.ob.i = Math.min(S.ob.steps.length - 1, S.ob.i + 1); renderOnboarding(); break;
    case 'ob-skip': if (S.ob.steps[S.ob.i] === 'welcome') { closeSheet(); } else { S.ob.i++; renderOnboarding(); } break;
    case 'ob-finish': finishOnboarding(false); $('#sheetRoot').innerHTML = ''; switchTab('home'); confetti(160); break;
    case 'ob-add-account': {
      const name = $('#obAName').value.trim(), bal = r2(Math.max(0, toNum($('#obABal').value)));
      if (!name) { $('#obAName').focus(); break; }
      const nowISO = new Date().toISOString();
      S.data.accounts.push({ id: uid(), name: name.slice(0, 60), type: ACCOUNT_TYPES[$('#obAType').value] ? $('#obAType').value : 'other', balance: bal, archived: false, createdAt: nowISO, updatedAt: nowISO });
      commit(); renderOnboarding(); break;
    }
    case 'ob-add-sub': {
      const name = $('#obSName').value.trim();
      if (!name) { $('#obSName').focus(); break; }
      const next = toISO(addDays(parseISO(todayISO()), 30));
      S.data.subscriptions.push({ id: uid(), name: name.slice(0, 60), amount: r2(Math.max(0, toNum($('#obSAmt').value))), cycle: CYCLES[$('#obSCycle').value] ? $('#obSCycle').value : 'monthly', nextRenewal: next, anchorDay: parseISO(next).getDate(), category: 'Other', cardId: 'other', review: false, cancelledAt: null, createdAt: new Date().toISOString() });
      commit(); renderOnboarding(); break;
    }
    case 'add-account': accountForm(null, b.dataset.kind); break;
    case 'edit-account': { const a = S.data.accounts.find((x) => x.id === b.dataset.id); if (a) accountForm(a); break; }
    case 'archive-account': { const a = S.data.accounts.find((x) => x.id === b.dataset.id); if (a) { a.archived = !a.archived; closeSheet(); commit(); toast(a.archived ? 'ARCHIVED' : 'UNARCHIVED', a.archived ? `${a.name} no longer counts toward net worth.` : `${a.name} counts again.`, 'info'); } break; }
    case 'delete-account': { const a = S.data.accounts.find((x) => x.id === b.dataset.id); if (a) { closeSheet(); undoable('ACCOUNT DELETED', a.name, () => { S.data.accounts = S.data.accounts.filter((x) => x !== a); }); } break; }
    case 'add-sub': subForm(null); break;
    case 'edit-sub': { const x = S.data.subscriptions.find((y) => y.id === b.dataset.id); if (x) subForm(x); break; }
    case 'cut-sub': { const x = S.data.subscriptions.find((y) => y.id === b.dataset.id); if (x) cutItSheet(x); break; }
    case 'cancel-sub': { const x = S.data.subscriptions.find((y) => y.id === b.dataset.id); if (x) { $('#sheetRoot').innerHTML = ''; undoable('CUT!', `${x.name}: ${money0(subYearly(x))}/yr back in your pocket`, () => { x.cancelledAt = new Date().toISOString(); x.review = false; }); confetti(120); } break; }
    case 'reactivate-sub': { const x = S.data.subscriptions.find((y) => y.id === b.dataset.id); if (x) { x.cancelledAt = null; if (x.nextRenewal < todayISO()) rollRenewals(S.data, todayISO()); closeSheet(); commit(); } break; }
    case 'delete-sub': { const x = S.data.subscriptions.find((y) => y.id === b.dataset.id); if (x) { closeSheet(); undoable('SUBSCRIPTION DELETED', x.name, () => { S.data.subscriptions = S.data.subscriptions.filter((y) => y !== x); }); } break; }
    case 'sub-filter': S.subFilter = b.dataset.v; render(); break;
    case 'more-back': switchTab('more'); break;
    case 'gs-go': searchGo(b.dataset.kind, b.dataset.id); break;
    case 'insight-go': { const i = allInsights().find((x) => x.id === b.dataset.id); if (i) switchTab(i.action.sub || i.action.tab); break; }
    case 'insight-dismiss': { const i = allInsights().find((x) => x.id === b.dataset.id); if (i) { const snapBefore = S.data.insightDismissals[i.id]; dismissInsight(S.data, i); commit(); toast('DISMISSED', 'It comes back if the numbers change.', 'info', { label: 'Undo', fn: () => { if (snapBefore) S.data.insightDismissals[i.id] = snapBefore; else delete S.data.insightDismissals[i.id]; commit(); } }); } break; }
    case 'insight-restore': delete S.data.insightDismissals[b.dataset.id]; commit(); break;
    case 'wb-cat': S.wb.query = SPEND_CATEGORIES[b.dataset.v]; render(); break;
    case 'add-card': cardPresetPicker(); break;
    case 'card-preset': {
      const pre = CARD_PRESETS.find((x) => x.id === b.dataset.id);
      const card = pre ? cardFromPreset(pre, new Date().toISOString()) : normalizeWalletCard({ name: 'New card', rules: [{ category: 'everything', rate: 1 }] });
      const guess = S.data.debts.find((d) => d.type !== 'loan' && normName(d.name).split(' ').some((w) => w.length > 3 && normName(card.name).includes(w)));
      if (guess) card.debtId = guess.id;
      $('#sheetRoot').innerHTML = ''; cardForm(card, true); break;
    }
    case 'edit-card': { const c = S.data.wallet.find((x) => x.id === b.dataset.id); if (c) cardForm(c, false); break; }
    case 'card-add-rule': readCardForm(); S.cardDraft.rules.push({ id: uid(), category: 'dining', merchants: [], rate: 1, cap: null, capPeriod: 'calendarYear', afterRate: null }); renderCardForm(); break;
    case 'card-del-rule': readCardForm(); S.cardDraft.rules.splice(+b.dataset.i, 1); renderCardForm(); break;
    case 'card-add-credit': readCardForm(); S.cardDraft.credits.push({ id: uid(), name: 'Credit', amount: 0, period: 'monthly', resetMonth: 1, used: {} }); renderCardForm(); break;
    case 'card-del-credit': readCardForm(); S.cardDraft.credits.splice(+b.dataset.i, 1); renderCardForm(); break;
    case 'delete-card': { const c = S.data.wallet.find((x) => x.id === b.dataset.id); if (c) { $('#sheetRoot').innerHTML = ''; undoable('CARD REMOVED', c.name, () => { S.data.wallet = S.data.wallet.filter((x) => x !== c); }); } break; }
    case 'credit-toggle': {
      const c = S.data.wallet.find((x) => x.id === b.dataset.card), cr = c && c.credits.find((x) => x.id === b.dataset.id);
      if (cr) { const on = toggleCreditUsed(cr, todayISO()); commit(); if (on) toast(`+${money0(cr.amount)} CAPTURED`, `${c.name}: ${cr.name}`, 'info'); }
      break;
    }
    case 'log-spend': spendForm(); break;
    case 'del-spend': { const e2 = S.data.cardSpend.find((x) => x.id === b.dataset.id); if (e2) undoable('ENTRY DELETED', money0(e2.amount), () => { S.data.cardSpend = S.data.cardSpend.filter((x) => x !== e2); }); break; }
    case 'add-merchant': merchantForm(null, b.dataset.name || ''); break;
    case 'edit-merchant': { const m = S.data.merchants.find((x) => x.id === b.dataset.id); if (m) merchantForm(m); break; }
    case 'delete-merchant': { const m = S.data.merchants.find((x) => x.id === b.dataset.id); if (m) { $('#sheetRoot').innerHTML = ''; undoable('MERCHANT DELETED', m.name, () => { S.data.merchants = S.data.merchants.filter((x) => x !== m); }); } break; }
    case 'home-down': S.data.home.downPct = toNum(b.dataset.v); commit(); break;
    case 'home-preapproved': S.data.home.preapproved = !S.data.home.preapproved; commit(); break;

    case 'edit-program': { const pr = S.data.home.programs.find((x) => x.id === b.dataset.id); if (pr) programForm(pr); break; }
    case 'delete-program': { const pr = S.data.home.programs.find((x) => x.id === b.dataset.id); if (pr) { $('#sheetRoot').innerHTML = ''; undoable('PROGRAM DELETED', pr.name, () => { S.data.home.programs = S.data.home.programs.filter((x) => x !== pr); }); } break; }
    case 'set-week': S.data.settings.weekStart = +b.dataset.v === 1 ? 1 : 0; commit(); break;
    case 'cal-day': S.cal.sel = S.cal.sel === b.dataset.date ? null : b.dataset.date; render(); break;
    case 'cal-prev': case 'cal-next': S.cal.month = shiftMonth(S.cal.month || todayISO().slice(0, 7), act === 'cal-prev' ? -1 : 1); S.cal.sel = null; render(); break;
    case 'add-milestone': milestoneForm(null); break;
    case 'edit-milestone': { const m = S.data.customMilestones.find((x) => x.id === b.dataset.id); if (m) milestoneForm(m); break; }
    case 'reset-baseline':
      if (confirm('Compare future check-ins against your current plan instead? Past check-ins stay saved.')) { snapshotBaseline(); commit(); }
      break;
    case 'export-ics':
      downloadFile('money-hq-reminders.ics', buildICS(), 'text/calendar');
      toast('CALENDAR FILE READY', 'Paydays, due dates, renewals and credit resets.', 'info');
      break;
    case 'sync-now': pull(); break;
    case 'sign-out': signOut(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'cl-check': payChecklistItem(b.dataset.date, b.dataset.key); break;
    case 'cl-undo':
      if (uncheckChecklistItem(S.data, b.dataset.date, b.dataset.key)) { S.checkinDraft = null; commit(); toast('UNDONE', 'Balance put back.', 'info'); }
      break;
    case 'cl-dismiss': { const c = S.data.payChecklists.find((x) => x.date === b.dataset.date); if (c) { c.dismissed = true; commit(); } break; }
    case 'dismiss-summary': { const sm = S.data.monthlySummaries.find((x) => x.month === b.dataset.month); if (sm) { sm.dismissed = true; commit(); } break; }
  }
});
$('#sync').addEventListener('click', () => pull());

function payChecklistItem(date, key) {
  const list = S.data.payChecklists.find((c) => c.date === date);
  const item = list && list.items.find((i) => i.key === key);
  if (!item) return;
  const draft = S.clDraft[`${date}|${key}`];
  const amount = draft != null && draft !== '' ? toNum(draft) : item.planned;
  const res = checkChecklistItem(S.data, date, key, amount);
  if (!res.ok) return;
  delete S.clDraft[`${date}|${key}`];
  S.checkinDraft = null;
  commit();
  if (res.paidOff) { confetti(260); toast(`${res.paidOff.name.toUpperCase()} IS PAID!`, 'Rolling that payment forward. 🔥'); }
  if (res.complete) { setTimeout(() => { confetti(320); toast('PAYCHECK DONE ✅', `All ${plural(list.items.length, 'payment')} made. Nice work.`); }, res.paidOff ? 900 : 0); }
  else if (!res.paidOff) {
    const debt = item.kind === 'debt' ? S.data.debts.find((d) => d.id === item.debtId) : null;
    toast(item.kind === 'hysa' ? `+${money0(res.item.paid)} TO HYSA` : `${money0(res.item.paid)} → ${item.label.toUpperCase()}`,
      debt ? `Balance now ${money(debt.balance)}` : item.kind === 'hysa' ? `Savings now ${money(S.data.savings.balance)}` : 'Marked done', 'info');
  }
  setTimeout(checkMilestones, 1200);
}

/** Starting point for a new custom order: the current order of another strategy. */
function priorityOrderIds(strategy) {
  const p = simulatePayoff(S.data.debts, planOpts(0, 0, strategy));
  const ids = p.payoffs.map((x) => x.id);
  unpaid().forEach((d) => { if (!ids.includes(d.id)) ids.push(d.id); });
  return ids;
}

function exportData() {
  const payload = { app: 'money-hq', exportedAt: new Date().toISOString(), data: S.data };
  downloadFile(`money-hq-${todayISO()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast('EXPORTED', 'Backup file downloaded.', 'info');
}
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const raw = parsed && parsed.data && typeof parsed.data === 'object' && !Array.isArray(parsed.data) ? parsed.data : parsed;
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.debts)) throw new Error('No debts found in that file.');
    if (!confirm(`Import ${plural(raw.debts.length, 'debt')}? This replaces all current data.`)) return;
    S.data = normalize(raw, todayISO());
    S.checkinDraft = null;
    commit();
    toast('IMPORTED', 'Your data was restored.', 'info');
  } catch (err) {
    alert('Import failed: ' + (err && err.message ? err.message : err));
  }
});

/* ---------- auth & boot ---------- */
function show(which) {
  $('#boot').classList.toggle('hidden', which !== 'boot');
  $('#auth').classList.toggle('hidden', which !== 'auth');
  $('#app').classList.toggle('hidden', which !== 'app');
}
function redirectUrl() {
  return location.hostname.endsWith('github.io') || location.protocol === 'file:' ? SITE_URL : location.origin + location.pathname;
}
$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#authEmail').value.trim();
  const btn = $('#authBtn'), msg = $('#authMsg');
  btn.disabled = true; btn.textContent = 'Sending…'; msg.style.color = '';
  try {
    const { error } = await S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectUrl() } });
    if (error) throw error;
    msg.innerHTML = `Check <b>${esc(email)}</b> for your sign-in link. Open it on this device.`;
    msg.style.color = 'var(--accent)';
  } catch (err) {
    msg.textContent = 'Could not send link: ' + (err.message || err);
    msg.style.color = 'var(--debt)';
  } finally { btn.disabled = false; btn.textContent = 'Send magic link'; }
});

async function signOut() {
  if (!confirm('Sign out? Your data stays saved in the cloud.')) return;
  if (S.meta.dirty) await push();
  await S.sb.auth.signOut();
}

function startApp(user) {
  const sameUser = S.user && S.user.id === user.id;
  S.user = user;
  if (!sameUser) {
    S.data = blank(); S.meta = { updatedAt: null, syncedAt: null, dirty: false };
    S.checkinDraft = null;
    loadCache();
    try {
      const saved = JSON.parse(storageGet('money-hq:tab') || 'null');
      if (saved && TABS.includes(saved.tab)) { S.tab = saved.tab; if (DEBT_SUBS.includes(saved.sub)) S.debtTab = saved.sub; if (MORE_PAGES.includes(saved.more)) S.moreView = saved.more; }
    } catch (_) { /* first run on this device */ }
    if (!navigator.onLine) S.synced = true;
  }
  show('app');
  render();
  setSync(S.meta.dirty ? 'syncing' : 'saved');
  pull();
}
function stopApp() {
  S.user = null; clearTimeout(S.pushTimer);
  S.data = blank(); S.meta = { updatedAt: null, syncedAt: null, dirty: false };
  S.checkinDraft = null;
  show('auth');
}

async function boot() {
  if (!window.supabase || !window.supabase.createClient) {
    $('#boot').innerHTML = `<div class="boot-msg">${navigator.onLine ? 'Could not load the sign-in service. Check your connection and reload.' : 'You\'re offline. Connect once to sign in.'}</div>`;
    return;
  }
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith('PASTE_')) {
    $('#boot').innerHTML = '<div class="boot-msg">SETUP NEEDED<div style="font-family:var(--font-body);font-size:15px;margin-top:8px">Paste your Supabase anon key into <code>SUPABASE_ANON_KEY</code> in index.html.</div></div>';
    return;
  }
  S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'debt-tracker-auth' }
  });
  const hashErr = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
  S.sb.auth.onAuthStateChange((event, session) => {
    // defer so we never call Supabase from inside the auth callback
    setTimeout(() => {
      if (session && session.user) { if (!S.user || S.user.id !== session.user.id) startApp(session.user); }
      else if (event === 'SIGNED_OUT' || !S.user) stopApp();
    }, 0);
  });
  const { data } = await S.sb.auth.getSession();
  if (data && data.session) {
    if (!S.user) startApp(data.session.user);
    if (location.hash.includes('access_token') || location.search.includes('code=')) history.replaceState(null, '', location.pathname);
  } else {
    stopApp();
    if (hashErr) { $('#authMsg').textContent = hashErr.replace(/\+/g, ' '); $('#authMsg').style.color = 'var(--debt)'; }
  }
}

window.addEventListener('online', () => { if (S.user) { setSync('syncing'); pull(); } });
window.addEventListener('offline', () => setSync('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) pull(); else if (S.meta.dirty) push(); });
window.addEventListener('focus', () => { if (S.user) pull(); });
window.addEventListener('pagehide', () => { if (S.meta.dirty) push(); });
document.addEventListener('focusout', () => { setTimeout(() => { if (S.pendingRender && !isEditing()) render(); }, 0); });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
</body>
