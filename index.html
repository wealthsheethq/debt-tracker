<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money HQ</title>
<meta name="description" content="Money HQ: your private money dashboard for debt payoff, net worth and subscriptions">
<meta name="theme-color" content="#0B0C0F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money HQ">
<meta name="application-name" content="Money HQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   Money HQ design system
   ===================================================================== */
:root {
  /* surfaces */
  --bg: #0B0C0F;
  --surface: #14161B;
  --surface-2: #1B1E25;
  --surface-3: #242832;
  --line: #262A33;
  --line-strong: #353A46;
  /* ink (all ≥ 4.5:1 on --surface) */
  --text: #F5F6F8;
  --muted: #A6ADB9;
  --faint: #8A92A0;
  /* brand + status */
  --accent: #C6FF3D;
  --accent-ink: #0B0C0F;
  --accent-soft: rgba(198,255,61,.12);
  --accent-line: rgba(198,255,61,.45);
  --debt: #FF5C7A;
  --debt-soft: rgba(255,92,122,.12);
  --good: #C6FF3D;
  --warn: #FFB547;
  --warn-soft: rgba(255,181,71,.10);
  --save: #3DD6FF;
  /* chart series (validated for colorblind separation on the dark surface) */
  --plan-a: #E0527A;
  --plan-b: #3197CC;
  --s-debt: #E0527A;
  --s-hysa: #3197CC;
  --s-invest: #5E9E2E;
  --s-total: #C08A1E;
  --s-asset: #3197CC;
  --s-liab: #E0527A;
  --s-nw: #C6FF3D;
  --b-rent: #C08A1E;
  --b-debt: #E0527A;
  --b-hysa: #3197CC;
  --b-spend: #5E9E2E;
  --b-custom: #9A6ADB;
  /* spacing scale */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  /* type scale */
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-base: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 36px; --fs-hero: 60px;
  /* shape + depth */
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --shadow-card: 0 1px 0 rgba(255,255,255,.035) inset, 0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-pop: 0 18px 50px rgba(0,0,0,.55);
  /* motion */
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur-1: .14s; --dur-2: .24s; --dur-3: .4s;
  --tab-h: 70px;
  --font-head: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --font-num: 'DM Mono', ui-monospace, Menlo, monospace;
  --font-body: 'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.45;
  min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; letter-spacing: .6px; margin: 0; line-height: 1; }
h1 { font-size: 44px; }
h2 { font-size: var(--fs-2xl); }
h3 { font-size: var(--fs-xl); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: var(--fs-sm); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; }
.ic.sm { width: 16px; height: 16px; vertical-align: -3px; }
.ic.lg { width: 26px; height: 26px; }

/* ---------- shell ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: calc(env(safe-area-inset-top) + var(--sp-3)) var(--sp-4) var(--sp-3);
  background: rgba(11,12,15,.86); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; }
.brand .logo .ic { width: 18px; height: 18px; stroke-width: 2.6; vertical-align: 0; }
.app-header h1 { font-size: 28px; letter-spacing: 1px; white-space: nowrap; }
.app-header h1 span { color: var(--accent); }
main { max-width: 720px; margin: 0 auto; padding: var(--sp-4) var(--sp-4) calc(var(--tab-h) + env(safe-area-inset-bottom) + var(--sp-6)); overflow-x: clip; }
.view { display: none; }
.view.active { display: block; animation: viewIn var(--dur-2) var(--ease); }
.view.active.from-left { animation-name: viewInLeft; }
@keyframes viewIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes viewInLeft { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.subview { animation: fadeUp var(--dur-2) var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* sub navigation (Debt section) */
.subnav { position: sticky; top: calc(env(safe-area-inset-top) + 57px); z-index: 15; display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none;
  margin: calc(var(--sp-4) * -1) calc(var(--sp-4) * -1) var(--sp-4); padding: var(--sp-3) var(--sp-4); background: rgba(11,12,15,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; min-height: 38px; padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-weight: 700; font-size: var(--fs-sm); cursor: pointer; transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1); }
.subnav button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* page headings */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); margin: var(--sp-2) 0 var(--sp-4); flex-wrap: wrap; }
.eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.section-title { font-family: var(--font-head); font-size: var(--fs-3xl); margin: var(--sp-2) 0 var(--sp-3); letter-spacing: .6px; }
.section-title em { font-style: normal; color: var(--accent); }
.group-label { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: var(--sp-6) 0 var(--sp-3); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--sp-4); margin-bottom: var(--sp-3); min-width: 0; box-shadow: var(--shadow-card);
}
.card.flat { box-shadow: none; }
.card.tap { cursor: pointer; transition: transform var(--dur-1) var(--ease), border-color var(--dur-1); }
.card.tap:hover { border-color: var(--line-strong); }
.card.tap:active { transform: scale(.985); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); flex-wrap: wrap; }
.card-head h3 { display: flex; align-items: center; gap: var(--sp-2); }
.grid-2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: var(--sp-3); }

/* ---------- sync pill ---------- */
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-family: var(--font-num);
  min-height: 32px; padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; cursor: pointer; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync[data-state="saved"] i { background: var(--good); }
.sync[data-state="syncing"] i { background: var(--warn); animation: pulse 1s infinite; }
.sync[data-state="offline"] i, .sync[data-state="error"] i { background: var(--debt); }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, minmax(0,1fr));
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding: 6px var(--sp-2) env(safe-area-inset-bottom);
  background: rgba(17,19,24,.92); backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .1px; cursor: pointer; min-width: 0; padding: 0 1px; white-space: nowrap; overflow: hidden; border-radius: var(--r-md);
  transition: color var(--dur-1);
}
.tabbar button .ic { width: 23px; height: 23px; transition: transform var(--dur-2) var(--ease); }
.tabbar button::before { content: ''; position: absolute; top: 4px; width: 44px; height: 32px; border-radius: var(--r-pill); background: var(--accent-soft); opacity: 0; transform: scale(.6); transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease); }
.tabbar button.active { color: var(--accent); }
.tabbar button.active::before { opacity: 1; transform: none; }
.tabbar button.active .ic { transform: translateY(-1px); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 48px; padding: 0 var(--sp-5); border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface-2); color: var(--text); font-weight: 700; font-size: var(--fs-md); cursor: pointer; text-decoration: none; text-align: center;
  transition: transform var(--dur-1) var(--ease), background var(--dur-1), border-color var(--dur-1), opacity var(--dur-1);
}
.btn:hover { border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { background: transparent; color: var(--debt); border-color: rgba(255,92,122,.5); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 var(--sp-3); font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn.icon { min-height: 44px; min-width: 44px; padding: 0; font-size: 18px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; font-size: inherit; min-height: 32px; }

/* ---------- inputs ---------- */
.field { display: block; margin-bottom: var(--sp-3); min-width: 0; }
.field > span { display: block; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.input, select.input {
  width: 100%; min-height: 50px; padding: 0 var(--sp-4); border-radius: var(--r-md);
  background: var(--bg); border: 1px solid var(--line-strong); color: var(--text); font-size: 17px;
  appearance: none; -webkit-appearance: none; min-width: 0; transition: border-color var(--dur-1), box-shadow var(--dur-1);
}
.input::placeholder { color: var(--faint); }
.input.num { font-family: var(--font-num); }
.input:focus, .input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.prefix { position: relative; min-width: 0; }
.prefix > b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 400; font-family: var(--font-num); pointer-events: none; }
.prefix > .input { padding-left: 30px; }
.suffix { position: relative; min-width: 0; }
.suffix > b { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 400; font-family: var(--font-num); pointer-events: none; }
.suffix > .input { padding-right: 34px; }
.hint { font-size: var(--fs-sm); color: var(--muted); margin: -4px 0 var(--sp-3); }
.check { display: flex; align-items: center; gap: var(--sp-3); min-height: 44px; font-size: 14px; color: var(--muted); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 4px; gap: 4px; }
.seg button { min-height: 42px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; font-size: 14px; transition: background var(--dur-1), color var(--dur-1); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chips-filter { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.chips-filter button { min-height: 36px; padding: 0 var(--sp-3); border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font-weight: 700; font-size: var(--fs-sm); cursor: pointer; }
.chips-filter button.on { background: var(--surface-3); color: var(--text); border-color: var(--faint); }

/* ---------- hero / stats ---------- */
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 0% 0%, rgba(198,255,61,.12) 0%, rgba(198,255,61,0) 55%), var(--surface); }
.hero .big { font-family: var(--font-head); font-size: var(--fs-hero); line-height: .9; color: var(--accent); overflow-wrap: anywhere; letter-spacing: .5px; }
.hero .label { text-transform: uppercase; letter-spacing: 1.6px; font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-num); font-size: var(--fs-sm); padding: 3px 8px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); }
.delta.neg { background: var(--debt-soft); color: var(--debt); }
.delta.flat { background: var(--surface-2); color: var(--muted); }
.progress { position: relative; height: 12px; background: var(--bg); border-radius: var(--r-pill); overflow: hidden; border: 1px solid var(--line); }
.progress > div { height: 100%; background: linear-gradient(90deg, #8BEA12, var(--accent)); border-radius: var(--r-pill); transition: width .7s var(--ease); }
.progress.save > div { background: linear-gradient(90deg, #1FA8D6, var(--save)); }
.progress.util > div { background: var(--muted); }
.progress.util.hot > div { background: var(--debt); }
.progress .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-family: var(--font-num); margin-top: 4px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: var(--sp-3); min-width: 0; }
.stat .k { font-size: var(--fs-xs); color: var(--muted); }
.stat .v { font-family: var(--font-num); font-size: var(--fs-lg); font-weight: 500; overflow-wrap: anywhere; }

/* home tiles */
.tiles { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-3); margin-bottom: var(--sp-3); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4); min-width: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 6px; min-height: 128px; transition: transform var(--dur-1) var(--ease), border-color var(--dur-1); }
.tile:hover { border-color: var(--line-strong); }
.tile:active { transform: scale(.975); }
.tile .t-head { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; min-width: 0; line-height: 1.2; white-space: nowrap; }
.tile .t-ico { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); }
.tile .t-ico .ic { width: 16px; height: 16px; vertical-align: 0; }
.tile .t-val { font-family: var(--font-head); font-size: 34px; line-height: .95; overflow-wrap: anywhere; }
.tile .t-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: auto; }

/* insights */
.insights { display: flex; gap: var(--sp-3); overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(var(--sp-4) * -1) var(--sp-3); padding: 2px var(--sp-4) var(--sp-2); scrollbar-width: none; }
.insights::-webkit-scrollbar { display: none; }
.insight { flex: 0 0 min(82%, 300px); scroll-snap-align: start; background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4); display: flex; gap: var(--sp-3); align-items: flex-start; }
.insight .i-ico { width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.insight .i-ico .ic { vertical-align: 0; }
.insight.warn .i-ico { background: var(--warn-soft); color: var(--warn); }
.insight.bad .i-ico { background: var(--debt-soft); color: var(--debt); }
.insight p { margin: 0; font-size: var(--fs-md); line-height: 1.4; }
.insight { position: relative; }
.insight .i-main { flex: 1; min-width: 0; background: none; border: 0; padding: 0 22px 0 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.insight .i-x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--faint); cursor: pointer; display: grid; place-items: center; }
.insight .i-x:hover { background: var(--surface-3); color: var(--text); }
.insight .i-x .ic { vertical-align: 0; }
.insight.wide { flex: none; width: 100%; }
@media (min-width: 760px) {
  .insights { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); overflow: visible; margin: 0 0 var(--sp-3); padding: 0; }
  .insights .insight { flex: none; }
}
.up.credit .d b { color: var(--warn); }
/* global search */
.gsearch { position: relative; margin-bottom: var(--sp-4); }
.gsearch .ic.lead { position: absolute; left: 14px; top: 15px; color: var(--faint); pointer-events: none; }
.gsearch .input { padding-left: 42px; border-radius: var(--r-pill); background: var(--surface); }
.gs-out { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 25; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 4px var(--sp-3); box-shadow: var(--shadow-pop); max-height: 60vh; overflow-y: auto; }
@media (min-width: 900px) { .tabbar { padding-left: calc(50% - 380px); padding-right: calc(50% - 380px); } }
/* user-chosen reduced motion */
html.rm *, html.rm *::before, html.rm *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

/* list rows */
.list { list-style: none; margin: 0; padding: 0; }
.li { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3) 0; border-top: 1px solid var(--line); min-height: 60px; }
.li:first-child { border-top: 0; }
.li.tap { cursor: pointer; }
.li .l-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.li .l-ico .ic { vertical-align: 0; }
.li .l-main { min-width: 0; }
.li .l-main b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.li .l-main span { display: block; font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .l-end { text-align: right; font-family: var(--font-num); white-space: nowrap; }
.li .l-end small { display: block; font-size: var(--fs-xs); color: var(--muted); font-family: var(--font-body); }
.li.archived { opacity: .6; }

/* ---------- plans ---------- */
.plans { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-3); }
.plan { background: var(--surface-2); border: 2px solid transparent; border-radius: var(--r-md); padding: var(--sp-3); min-width: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color var(--dur-1); }
.plan.on { border-color: var(--accent); }
.plan .tag { font-family: var(--font-head); font-size: 20px; display: flex; align-items: center; gap: 6px; }
.plan .tag i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.plan .date { font-family: var(--font-head); font-size: 32px; line-height: 1; margin: 6px 0 2px; }
.plan .meta { font-size: var(--fs-xs); color: var(--muted); }
.plan .val { font-family: var(--font-num); font-size: 14px; }
.badge { display: inline-block; font-size: var(--fs-xs); font-weight: 700; padding: 3px 8px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); margin-top: var(--sp-2); }
.badge.neg { background: var(--debt-soft); color: var(--debt); }
.badge.neutral { background: var(--bg); color: var(--muted); }

input[type=range] { width: 100%; height: 44px; background: transparent; accent-color: var(--accent); margin: 4px 0; }
.whatif-out { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-3); margin-top: var(--sp-3); }

/* ---------- timeline ---------- */
.tl-row { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: var(--sp-3); align-items: center; margin-bottom: var(--sp-3); }
.tl-rank { font-family: var(--font-head); font-size: 22px; color: var(--accent); text-align: center; }
.tl-top { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: 14px; margin-bottom: 4px; }
.tl-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tl-top span { font-family: var(--font-num); font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.tl-track { position: relative; height: 12px; background: var(--bg); border-radius: var(--r-pill); }
.tl-bar { position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--r-pill); background: var(--accent); }
.tl-axis { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-num); color: var(--faint); margin: 2px 0 0 36px; }

/* ---------- charts ---------- */
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 6px 14px; font-size: var(--fs-sm); color: var(--muted); flex-wrap: wrap; margin-bottom: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 3px; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 8px 10px; font-size: var(--fs-xs); white-space: nowrap; transform: translateX(-50%); z-index: 2; top: 4px; box-shadow: var(--shadow-pop); }
.tip .num { font-size: var(--fs-xs); }
.hbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px var(--sp-3); align-items: center; padding: 6px 0; cursor: default; }
.hbar .hb-label { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .hb-val { font-family: var(--font-num); font-size: var(--fs-sm); text-align: right; }
.hbar .hb-track { grid-column: 1 / -1; height: 10px; border-radius: var(--r-pill); background: var(--bg); overflow: hidden; }
.hbar .hb-fill { height: 100%; border-radius: var(--r-pill); background: var(--s-asset); }

/* ---------- budget flow ---------- */
.flowbar { display: flex; gap: 2px; height: 26px; border-radius: var(--r-sm); overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.flowbar > div { height: 100%; min-width: 3px; }
.flow-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: var(--sp-3); table-layout: fixed; }
.flow-table th { text-align: right; font-weight: 500; color: var(--faint); font-size: var(--fs-xs); padding: 4px 0; }
.flow-table th:first-child { text-align: left; }
.flow-table td { padding: 8px 0; border-top: 1px solid var(--line); text-align: right; font-family: var(--font-num); font-size: var(--fs-sm); }
.flow-table td:first-child { text-align: left; font-family: var(--font-body); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-table col.c1 { width: 40%; }
.flow-table col.c4 { width: 13%; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
.item-row { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) 44px; gap: var(--sp-2); align-items: center; margin-bottom: 4px; }
.item-row .input { min-height: 46px; font-size: 16px; }

/* ---------- debts ---------- */
.debt { position: relative; }
.debt.paid { opacity: .75; }
.debt.urgent { border-color: rgba(255,92,122,.6); }
.debt-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
.debt-name { font-family: var(--font-head); font-size: 26px; line-height: 1; overflow-wrap: anywhere; }
.debt-type { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
.debt-bal { font-family: var(--font-num); font-size: 22px; font-weight: 500; text-align: right; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: var(--sp-3) 0; }
.chip { font-size: var(--fs-xs); font-family: var(--font-num); padding: 4px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.chip.hot { color: var(--warn); }
.chip.ok { color: var(--accent); }
.chip.bad { color: #FFC2CE; background: var(--debt-soft); }
.debt-actions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-2); margin-top: var(--sp-3); }
.stamp { position: absolute; right: 14px; top: 44px; transform: rotate(-10deg); font-family: var(--font-head); font-size: 34px; color: var(--accent); border: 3px solid var(--accent); padding: 0 8px; border-radius: 8px; opacity: .9; }
.util-line { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--muted); margin: var(--sp-3) 0 4px; font-family: var(--font-num); flex-wrap: wrap; }
.order-list { list-style: none; margin: var(--sp-3) 0 0; padding: 0; }
.order-list li { display: grid; grid-template-columns: 24px minmax(0,1fr) 44px 44px; gap: 6px; align-items: center; padding: 6px; border-radius: var(--r-md); background: var(--surface-2); margin-bottom: 6px; }
.order-list li.dragging { opacity: .4; }
.order-list li.over { outline: 2px dashed var(--accent); }
.order-list .handle { cursor: grab; color: var(--faint); text-align: center; font-size: 18px; user-select: none; }
.order-list .nm { min-width: 0; }
.order-list .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-list .nm span { font-size: var(--fs-xs); color: var(--muted); font-family: var(--font-num); }

.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist li > div:first-child { min-width: 0; overflow-wrap: anywhere; }
.hist li:last-child { border-bottom: 0; }
.hist .when { font-size: var(--fs-xs); color: var(--faint); }
.hist .amt { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.amt.pos { color: var(--accent); }
.amt.neg { color: var(--debt); }

/* upcoming */
.up { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: var(--sp-3); align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.up:first-of-type { border-top: 0; }
.up .d { text-align: center; background: var(--surface-2); border-radius: var(--r-sm); padding: 4px 0; line-height: 1.05; }
.up .d b { font-family: var(--font-head); font-size: 24px; display: block; font-weight: 400; }
.up .d span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.up .w { min-width: 0; font-size: 14px; }
.up .w div:first-child { font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.up .w div + div { font-size: var(--fs-xs); color: var(--muted); overflow-wrap: anywhere; }
.up .a { font-family: var(--font-num); font-size: 14px; text-align: right; white-space: nowrap; }
.up.pay .d b { color: var(--accent); }
.up.due .d b { color: var(--warn); }
.up.sub .d b { color: var(--save); }

/* milestones */
.ms { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: var(--sp-3); align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.ms-label + .ms { border-top: 0; }
.ms .ico { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.ms .ico .ic { vertical-align: 0; }
.ms.earned .ico { background: var(--accent-soft); color: var(--accent); }
.ms .t { min-width: 0; overflow-wrap: anywhere; }
.ms .t div + div { font-size: var(--fs-xs); color: var(--muted); }
.ms.earned .t div:first-child { color: var(--accent); font-weight: 700; }
.ms .when { font-size: var(--fs-xs); font-family: var(--font-num); color: var(--muted); text-align: right; white-space: nowrap; }
.ms-label { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0 2px; }

/* payday checklist */
.paynow { border-color: var(--accent-line); background: radial-gradient(120% 90% at 0% 0%, rgba(198,255,61,.10) 0%, rgba(198,255,61,0) 60%), var(--surface); }
.paynow.missed { border-color: rgba(255,181,71,.55); background: var(--surface); }
.cl-row { display: grid; grid-template-columns: 48px minmax(0,1fr) minmax(0,118px); gap: var(--sp-3); align-items: center; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.cl-row.done .nm b { text-decoration: line-through; color: var(--muted); }
.cl-row .nm { min-width: 0; }
.cl-row .nm b { display: block; overflow-wrap: anywhere; }
.cl-row .nm span { font-size: var(--fs-xs); color: var(--muted); }
.cl-check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; transition: background var(--dur-1), transform var(--dur-1) var(--ease); }
.cl-check:active { transform: scale(.9); }
.cl-check .ic { stroke-width: 3; vertical-align: 0; }
.cl-row.done .cl-check { background: var(--accent); }
.cl-row .input { min-height: 44px; font-size: 16px; }
.cl-paid { text-align: right; font-family: var(--font-num); font-size: 15px; }
.cl-paid button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: var(--fs-xs); cursor: pointer; padding: 6px 0 0; min-height: 28px; }

/* recaps & tables */
.recap-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-2); }
.recap-grid .stat .v { font-size: 16px; }
details.recap { border-top: 1px solid var(--line); padding: 10px 0; }
details.recap:first-of-type { border-top: 0; }
details.recap summary { cursor: pointer; display: flex; justify-content: space-between; gap: var(--sp-3); font-weight: 700; list-style: none; min-height: 32px; align-items: center; }
details.recap summary::-webkit-details-marker { display: none; }
details.recap summary .num { font-weight: 400; font-size: 14px; }
details.recap[open] summary { margin-bottom: 10px; }
.mini-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--fs-sm); margin-top: 10px; }
.mini-table th { font-weight: 500; color: var(--faint); font-size: 11px; text-align: right; padding: 4px 0; }
.mini-table th:first-child, .mini-table td:first-child { text-align: left; }
.mini-table td { border-top: 1px solid var(--line); padding: 8px 0; text-align: right; font-family: var(--font-num); }
.mini-table tr.hl td { color: var(--text); font-weight: 500; }
.disclaimer { font-size: var(--fs-xs); color: var(--faint); border-left: 3px solid var(--line-strong); padding-left: 10px; margin: var(--sp-3) 0 0; }

/* paychecks */
.pc { border-left: 3px solid var(--accent); }
.pc.lump { border-left-color: var(--save); }
.pc.urgent { border-left-color: var(--debt); }
.pc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-bottom: var(--sp-2); }
.pc-date { font-family: var(--font-head); font-size: 22px; }
.pc-head .num { white-space: nowrap; }
.pc-line { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 6px 0; font-size: 15px; border-top: 1px dashed var(--line); }
.pc-line:first-of-type { border-top: 0; }
.pc-line span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pc-line .num { white-space: nowrap; }
.pc-line.save { color: var(--save); }
.pc-line.done { color: var(--accent); font-weight: 700; }
.pc-line.urgent { color: #FFC2CE; }

.alert { border-radius: var(--r-md); padding: var(--sp-3) 14px; font-size: 14px; margin-bottom: var(--sp-3); border: 1px solid rgba(255,181,71,.4); background: var(--warn-soft); color: #FFDDA8; }
.alert.bad { border-color: rgba(255,92,122,.45); background: var(--debt-soft); color: #FFC2CE; }
.alert.good { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.alert .btn { margin-top: 10px; }

/* empty states */
.empty { text-align: center; padding: var(--sp-8) var(--sp-4); }
.empty .e-ico { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto var(--sp-4); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty .e-ico .ic { width: 30px; height: 30px; vertical-align: 0; }
.empty h2 { margin-bottom: var(--sp-2); }
.empty p { color: var(--muted); margin: 0 auto var(--sp-5); max-width: 340px; }

/* check-in */
.ci-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,150px); gap: var(--sp-3); align-items: center; padding: var(--sp-2) 0; border-top: 1px solid var(--line); }
.ci-row .nm { min-width: 0; }
.ci-row .nm b { display: block; overflow-wrap: anywhere; }
.ci-row .nm span { font-size: var(--fs-xs); color: var(--muted); font-family: var(--font-num); }
.ci-group { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: var(--sp-4) 0 var(--sp-1); }
.ahead { font-family: var(--font-head); font-size: 28px; line-height: 1; margin: 2px 0; overflow-wrap: anywhere; }

/* subscriptions calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; text-align: center; }
.cal .dow { font-size: 11px; color: var(--faint); font-weight: 700; padding: 4px 0; }
.cal .day { position: relative; min-height: 42px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid transparent; font-family: var(--font-num); font-size: var(--fs-sm); color: var(--muted); padding: 4px 0 0; cursor: pointer; }
.cal .day.out { background: transparent; color: transparent; cursor: default; }
.cal .day.today { border-color: var(--accent-line); color: var(--text); }
.cal .day.has { color: var(--text); }
.cal .day.sel { background: var(--surface-3); border-color: var(--faint); }
.cal .day .dots { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 2px; }
.cal .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--save); }

/* ---------- sheet (modal) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn var(--dur-1) ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--sp-4) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom)); animation: sheetUp var(--dur-2) var(--ease); box-shadow: var(--shadow-pop); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 44px; height: 5px; background: var(--line-strong); border-radius: 3px; margin: 0 auto var(--sp-4); }
.sheet h2 { margin-bottom: var(--sp-4); }
.sheet-actions { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--sp-3); margin-top: var(--sp-2); }
@media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: var(--r-xl); border-bottom: 1px solid var(--line-strong); } }

/* onboarding */
.steps { display: flex; gap: 6px; margin-bottom: var(--sp-4); }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-strong); }
.steps i.on { background: var(--accent); }
.ob-hero { text-align: center; padding: var(--sp-4) 0 var(--sp-2); }
.ob-hero .e-ico { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto var(--sp-4); display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.ob-hero .e-ico .ic { width: 34px; height: 34px; vertical-align: 0; stroke-width: 2.4; }
.ob-added { margin: var(--sp-3) 0; }

/* ---------- toast & confetti ---------- */
.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 68px); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); pointer-events: none; padding: 0 var(--sp-4); }
.toast { pointer-events: auto; max-width: 440px; width: 100%; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-lg); padding: 14px var(--sp-4); box-shadow: var(--shadow-pop); animation: pop .35s cubic-bezier(.2,1.4,.4,1); display: flex; align-items: center; gap: var(--sp-3); }
.toast .t-body { flex: 1; min-width: 0; }
.toast b { font-family: var(--font-head); font-size: 26px; font-weight: 400; display: block; line-height: 1; }
.toast.info { background: var(--surface-3); color: var(--text); border: 1px solid var(--line-strong); }
.toast.info b { font-size: 20px; }
.toast.warn { background: #3A1520; color: #FFD6DE; border: 1px solid rgba(255,92,122,.6); }
.toast .t-act { flex: none; min-height: 40px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid currentColor; background: transparent; color: inherit; font-weight: 700; cursor: pointer; }
.toast.info .t-act { color: var(--accent); }
@keyframes pop { from { transform: translateY(-20px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; width: 100%; height: 100%; }

/* ---------- skeleton ---------- */
.skel { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-md); }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.skel-line { height: 14px; margin: 10px 0; }
.skel-card { height: 130px; margin-bottom: var(--sp-3); border-radius: var(--r-lg); }

/* ---------- auth / boot ---------- */
.auth { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: var(--sp-8) var(--sp-5); max-width: 440px; margin: 0 auto; }
.auth .brand { margin-bottom: var(--sp-6); }
.auth .brand .logo { width: 44px; height: 44px; border-radius: 13px; }
.auth .brand .logo .ic { width: 24px; height: 24px; }
.auth .brand b { font-family: var(--font-head); font-size: 30px; letter-spacing: 1px; font-weight: 400; }
.auth .brand b span { color: var(--accent); }
.auth h1 { font-size: 64px; line-height: .9; margin-bottom: var(--sp-3); }
.auth h1 span { color: var(--accent); display: block; }
.auth p { color: var(--muted); margin: 0 0 var(--sp-6); }
.auth .perks { list-style: none; padding: 0; margin: 0 0 var(--sp-6); display: grid; gap: var(--sp-2); color: var(--muted); font-size: var(--fs-md); }
.auth .perks li { display: flex; align-items: center; gap: var(--sp-2); }
.auth .perks .ic { color: var(--accent); }
.boot { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 76px) var(--sp-4) var(--sp-4); }

<!-- ================= ENGINE (pure functions, no DOM) ================= -->
<script id="engine">
/* ENGINE START */
const FREQUENCIES = {
  weekly:      { label: 'Weekly',                      perMonth: 52 / 12 },
  biweekly:    { label: 'Every 2 weeks (bi-weekly)',   perMonth: 26 / 12 },
  semimonthly: { label: 'Twice a month (1st & 15th)',  perMonth: 2 },
  monthly:     { label: 'Monthly',                     perMonth: 1 }
};
const STRATEGIES = ['avalanche', 'snowball', 'custom'];

const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
const toNum = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const newId = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function parseISO(s) {
  if (!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
}
function toISO(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function monthKey(d) { return d.getFullYear() * 12 + d.getMonth(); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function addMonthsKeepDay(d, n, day) {
  const y = d.getFullYear(), m = d.getMonth() + n;
  const target = new Date(y, m, 1, 12);
  target.setDate(Math.min(day, daysInMonth(target.getFullYear(), target.getMonth())));
  return target;
}

/** Next paycheck date on/after `from`, given an anchor payday and frequency. */
function firstPaycheckOnOrAfter(anchorISO, freq, from) {
  let anchor = parseISO(anchorISO) || from;
  if (freq === 'weekly' || freq === 'biweekly') {
    const step = freq === 'weekly' ? 7 : 14;
    const diff = Math.round((from - anchor) / 86400000);
    if (diff > 0) anchor = addDays(anchor, Math.ceil(diff / step) * step);
    return anchor;
  }
  if (freq === 'semimonthly') {
    let d = new Date(from.getFullYear(), from.getMonth(), from.getDate() <= 1 ? 1 : 15, 12);
    if (d < from) d = new Date(from.getFullYear(), from.getMonth() + 1, 1, 12);
    return d;
  }
  const day = anchor.getDate();
  let d = addMonthsKeepDay(new Date(from.getFullYear(), from.getMonth(), 1, 12), 0, day);
  if (d < from) d = addMonthsKeepDay(d, 1, day);
  return d;
}
function nextPaycheck(d, freq, anchorDay) {
  if (freq === 'weekly') return addDays(d, 7);
  if (freq === 'biweekly') return addDays(d, 14);
  if (freq === 'semimonthly') return d.getDate() < 15 ? new Date(d.getFullYear(), d.getMonth(), 15, 12) : new Date(d.getFullYear(), d.getMonth() + 1, 1, 12);
  return addMonthsKeepDay(d, 1, anchorDay);
}
/** Next date on/after `from` that falls on day-of-month `day` (clamped to short months). */
function nextDueDate(day, from) {
  let d = addMonthsKeepDay(new Date(from.getFullYear(), from.getMonth(), 1, 12), 0, day);
  if (d < from) d = addMonthsKeepDay(d, 1, day);
  return d;
}

/** Effective APR for a debt during the month that starts on `monthStart`. */
function effectiveApr(debt, monthStart) {
  if (debt.promoEnd && monthStart <= debt.promoEnd) return debt.promoApr || 0;
  return debt.apr;
}
/** The balance a card should stay under: limit minus the amount to keep open. Infinity = no limit set. */
function bufferLine(limit, keepOpen) {
  limit = toNum(limit);
  return limit > 0 ? r2(Math.max(0, limit - Math.max(0, toNum(keepOpen)))) : Infinity;
}

function priorityOrder(debts, strategy, when) {
  const live = debts.filter((d) => d.bal > 0.004);
  const avalanche = (a, b) => (effectiveApr(b, when) - effectiveApr(a, when)) || (b.apr - a.apr) || (a.bal - b.bal) || (a.idx - b.idx);
  if (strategy === 'snowball') return live.sort((a, b) => (a.bal - b.bal) || (b.apr - a.apr) || (a.idx - b.idx));
  if (strategy === 'custom') return live.sort((a, b) => (a.rank - b.rank) || avalanche(a, b));
  // avalanche: highest rate right now first (promo debts count as 0% until the promo ends)
  return live.sort(avalanche);
}

/**
 * Simulate payoff paycheck by paycheck.
 * Model: interest is charged monthly (APR/12 on the balance at the start of each
 * calendar month, 0 while a promo is active). Each paycheck pays, in order:
 *   1. minimums still owed this calendar month,
 *   2. whatever brings any card back under its buffer line (limit - keep-open), flagged urgent,
 *   3. every remaining dollar to the priority debt (avalanche / snowball / custom order),
 *      rolling over as debts close.
 *
 * opts: { perPaycheck, frequency, payAnchor (ISO), today (ISO), strategy, customOrder, lumpSum, maxMonths,
 *         skipThrough (ISO, optional: paydays on/before this date are already handled, e.g. by a payday checklist) }
 */
function simulatePayoff(debtsIn, opts) {
  const today = parseISO(opts.today) || new Date();
  const freq = FREQUENCIES[opts.frequency] ? opts.frequency : 'biweekly';
  const strategy = STRATEGIES.includes(opts.strategy) ? opts.strategy : 'avalanche';
  const customOrder = Array.isArray(opts.customOrder) ? opts.customOrder : [];
  const perPaycheck = Math.max(0, r2(toNum(opts.perPaycheck)));
  const lumpSum = Math.max(0, r2(toNum(opts.lumpSum)));
  const maxMonths = opts.maxMonths || 600;

  const debts = (debtsIn || [])
    .filter((d) => !d.paid && toNum(d.balance) > 0.004)
    .map((d, idx) => {
      const rank = customOrder.indexOf(d.id);
      return {
        id: d.id, name: d.name || 'Debt', idx, rank: rank < 0 ? 1e6 + idx : rank,
        bal: r2(toNum(d.balance)), startBal: r2(toNum(d.balance)),
        apr: Math.max(0, toNum(d.apr)), min: Math.max(0, toNum(d.minPayment)),
        line: bufferLine(d.creditLimit, d.keepOpen),
        promoEnd: parseISO(d.promoEnd), promoApr: Math.max(0, toNum(d.promoApr)), paidOn: null, interest: 0, paidTotal: 0, minDue: 0
      };
    });

  const res = {
    ok: true, strategy, today: toISO(today), totalInterest: 0, totalPaid: 0,
    startTotal: r2(debts.reduce((s, d) => s + d.bal, 0)),
    minTotal: r2(debts.reduce((s, d) => s + d.min, 0)),
    monthlyBudget: r2(perPaycheck * FREQUENCIES[freq].perMonth),
    perPaycheck, debtFree: null, months: 0, payoffs: [], lump: null, paychecks: [], series: [], warnings: [],
    overBuffer: debts.filter((d) => d.bal > d.line + 0.004).map((d) => ({ id: d.id, name: d.name, over: r2(d.bal - d.line) })),
    bufferRestored: {}
  };
  if (!debts.length) { res.debtFree = res.today; return res; }

  let curMonth = monthKey(today);
  debts.forEach((d) => { d.minDue = Math.min(d.min, d.bal); });
  const total = () => r2(debts.reduce((s, d) => s + d.bal, 0));

  const pay = (d, amt, date, allocs, isBuffer) => {
    amt = r2(Math.min(amt, d.bal));
    if (amt <= 0) return 0;
    d.bal = r2(d.bal - amt);
    d.paidTotal = r2(d.paidTotal + amt);
    d.minDue = Math.max(0, r2(d.minDue - amt));
    res.totalPaid = r2(res.totalPaid + amt);
    let a = allocs.find((x) => x.id === d.id);
    if (!a) { a = { id: d.id, name: d.name, amount: 0, buffer: 0 }; allocs.push(a); }
    a.amount = r2(a.amount + amt);
    if (isBuffer) a.buffer = r2(a.buffer + amt);
    if (d.bal <= 0.004 && !d.paidOn) {
      d.bal = 0; d.paidOn = toISO(date);
      res.payoffs.push({ id: d.id, name: d.name, date: d.paidOn, order: res.payoffs.length + 1, interest: r2(d.interest), paid: d.paidTotal });
    }
    if (isBuffer && d.bal <= d.line + 0.004 && !res.bufferRestored[d.id]) res.bufferRestored[d.id] = toISO(date);
    return amt;
  };
  const restoreBuffers = (date, avail, allocs) => {
    for (const d of priorityOrder(debts, strategy, date)) {
      if (avail <= 0) break;
      const need = r2(d.bal - d.line);
      if (need > 0) avail = r2(avail - pay(d, Math.min(need, avail), date, allocs, true));
    }
    return avail;
  };
  const payExtra = (date, avail, allocs) => {
    for (const d of priorityOrder(debts, strategy, date)) {
      if (avail <= 0) break;
      avail = r2(avail - pay(d, avail, date, allocs, false));
    }
    return avail;
  };

  res.series.push({ date: res.today, total: total() });

  // Day 1 lump sum: restore buffers first, then priority order
  if (lumpSum > 0) {
    const allocs = [];
    let avail = restoreBuffers(today, lumpSum, allocs);
    avail = payExtra(today, avail, allocs);
    res.lump = { date: res.today, amount: lumpSum, allocations: allocs, leftover: r2(avail), urgent: allocs.some((a) => a.buffer > 0) };
  }

  let payday = firstPaycheckOnOrAfter(opts.payAnchor, freq, today);
  const anchorDay = (parseISO(opts.payAnchor) || payday).getDate();
  if (opts.skipThrough) while (toISO(payday) <= opts.skipThrough) payday = nextPaycheck(payday, freq, anchorDay);
  const startKey = monthKey(today);

  while (debts.some((d) => d.bal > 0)) {
    // cross calendar-month boundaries: charge interest, reset minimums
    while (monthKey(payday) > curMonth) {
      curMonth += 1;
      const monthStart = new Date(Math.floor(curMonth / 12), curMonth % 12, 1, 12);
      for (const d of debts) {
        if (d.bal <= 0) continue;
        const interest = r2(d.bal * effectiveApr(d, monthStart) / 1200);
        d.bal = r2(d.bal + interest);
        d.interest = r2(d.interest + interest);
        res.totalInterest = r2(res.totalInterest + interest);
        d.minDue = Math.min(d.min, d.bal);
      }
      res.series.push({ date: toISO(monthStart), total: total() });
    }
    if (curMonth - startKey > maxMonths) {
      res.ok = false;
      res.warnings.push('Not paid off within ' + Math.round(maxMonths / 12) + ' years at this payment amount.');
      break;
    }

    const allocs = [];
    let avail = perPaycheck;
    for (const d of priorityOrder(debts, strategy, payday)) {   // 1) minimums still owed this month
      if (avail <= 0) break;

/**
 * Month-by-month projection for a plan: total debt (from the payoff simulation) and HYSA
 * (monthly compounding + monthly contribution + paycheck money freed up after payoffs).
 * sav: { balance, apy, monthlyContribution, lumpFromSavings }

function projectPlan(plan, sav) {
  const r = Math.pow(1 + toNum(sav.apy) / 100, 1 / 12) - 1;
  const contrib = toNum(sav.monthlyContribution);
  let hysa = toNum(sav.balance);
  if (sav.lumpFromSavings && plan.lump) hysa = Math.max(0, hysa - plan.lump.amount + plan.lump.leftover);
  const series = plan.series.length ? plan.series : [{ date: plan.today, total: 0 }];

  }
  return pts;
}

/** Month-by-month savings growth: monthly compounding, contribution at month end. */

}

/* ---------- accounts & net worth ---------- */
const ACCOUNT_TYPES = {

/**
 * Net worth from one source of truth per balance:

 *  - active (not archived) accounts add everything else.

  data.debts.filter((d) => !d.paid && toNum(d.balance) > 0).forEach((d) => items.push({ id: 'debt:' + d.id, name: d.name, type: d.type === 'loan' ? 'debtLoan' : 'debtCard', kind: 'liability', balance: r2(toNum(d.balance)), linked: 'debt' }));

  data.netWorthHistory = data.netWorthHistory.filter((x) => x.month !== month);

}

/**

/* ---------- subscriptions ---------- */
const CYCLES = {

const DEFAULT_MERCHANTS = [

  ["Trader Joe's", 'supermarket'], ['Aldi', 'supermarket'], ['Lidl', 'supermarket'], ['Wegmans', 'supermarket'],
  ['Walmart', 'superstore'], ['Target', 'superstore'], ['Costco', 'wholesale'], ["Sam's Club", 'wholesale'], ["BJ's", 'wholesale'],
  ['Amazon', 'online'], ['Apple', 'online'], ['Netflix', 'streaming'], ['Spotify', 'streaming'], ['Hulu', 'streaming'], ['Disney+', 'streaming'],
  ['YouTube TV', 'streaming'], ['Max', 'streaming'], ['Shell', 'gas'], ['Exxon', 'gas'], ['Mobil', 'gas'], ['BP', 'gas'], ['Circle K', 'gas'],
  ['QuikTrip', 'gas'], ['Sheetz', 'gas'], ['Starbucks', 'dining'], ["McDonald's", 'dining'], ['Chipotle', 'dining'], ['DoorDash', 'dining'],

  ['Ticketmaster', 'entertainment'], ['T-Mobile', 'phone'], ['Verizon', 'phone'], ['Nike', 'everything'], ['Home Depot', 'everything'], ["Lowe's", 'everything']

const normName = (s) => String(s || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
/** All merchants: yours first (they override built-ins with the same name), then the built-in list. */
function allMerchants(data) {
  const mine = data.merchants.map((m) => ({ name: m.name, category: m.category, source: 'mine', id: m.id }));
  const taken = new Set(mine.map((m) => normName(m.name)));
  return [...mine, ...DEFAULT_MERCHANTS.filter(([n]) => !taken.has(normName(n))).map(([name, category]) => ({ name, category, source: 'builtin' }))];
}

function merchantCategory(data, query) {
  const q = normName(query);

  const list = allMerchants(data);
  const exact = list.find((m) => normName(m.name) === q);
  if (exact) return { name: exact.name, category: exact.category, source: exact.source };
  const cat = Object.entries(SPEND_CATEGORIES).find(([k, label]) => k === q || normName(label) === q);

}

  if (period === 'quarter') return `${y}-Q${Math.floor(m / 3) + 1}`;

/* ---------- card credits ---------- */
const CREDIT_PERIODS = { monthly: { label: 'Monthly', perYear: 12 }, quarterly: { label: 'Quarterly', perYear: 4 }, semiannual: { label: 'Every 6 months', perYear: 2 }, annual: { label: 'Card year', perYear: 1 }, calendarYear: { label: 'Calendar year', perYear: 1 } };

    const p = creditPeriod(credit, today);

    tip.innerHTML = `<div class="faint">${esc(monthLabel(r.month))}</div><div><span style="color:var(--s-asset)">■</span> Assets <span class="num">${money0(r.assets)}</span></div><div><span style="color:var(--s-liab)">■</span> Liabilities <span class="num">${money0(r.liabilities)}</span></div><div>Net worth <span class="num">${money0(r.netWorth)}</span></div>`;
    tip.classList.remove('hidden');
    const X = ((c.L + c.slot * (+el.dataset.i + 0.5)) / c.W) * box.width, half = tip.offsetWidth / 2 + 4;
    tip.style.left = Math.min(Math.max(X, half), box.width - half) + 'px';
  };
  wrap.querySelectorAll('.bh').forEach((el) => {
    el.addEventListener('mouseenter', () => show(el));
    el.addEventListener('touchstart', () => show(el), { passive: true });
    el.addEventListener('mouseleave', () => tip.classList.add('hidden'));
  });
}
function wireCharts(root) {
  root.querySelectorAll('[data-chart]').forEach((wrap) => {
    const c = CHARTS[wrap.dataset.chart]; if (!c) return;
    if (c.type === 'bars') { wireBars(wrap, c); return; }
    const svg = wrap.querySelector('svg'), hit = wrap.querySelector('.hit'), tip = wrap.querySelector('.tip'), cx = wrap.querySelector('.cx');
    const move = (ev) => {
      const pt = ev.touches ? ev.touches[0] : ev;
      const box = svg.getBoundingClientRect();
      const vx = ((pt.clientX - box.left) / box.width) * c.W;
      const t = c.t0 + ((vx - c.L) / (c.W - c.L - c.R)) * (c.t1 - c.t0);
      let rows = '', snap = null;
      for (const s of c.series) {
        let best = null, bd = Infinity;
        for (const p of s.points) { const dd = Math.abs(parseISO(p.date).getTime() - t); if (dd < bd) { bd = dd; best = p; } }
        if (!best) continue;
        if (!snap || bd < Math.abs(parseISO(snap).getTime() - t)) snap = best.date;
        rows += `<div><span style="color:${s.color}">■</span> ${esc(s.label)} <span class="num">${money0(best.v)}</span> <span class="faint">${esc(fmtDate(best.date, { month: 'short', year: '2-digit' }))}</span></div>`;
      }
      const X = c.x(snap);
      cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.classList.remove('hidden');
      tip.innerHTML = rows;
      tip.classList.remove('hidden');
      const half = tip.offsetWidth / 2 + 4;
      tip.style.left = Math.min(Math.max((X / c.W) * box.width, half), box.width - half) + 'px';
    };
    const leave = () => { tip.classList.add('hidden'); cx.classList.add('hidden'); };
    hit.addEventListener('mousemove', move); hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', () => setTimeout(leave, 1800));
  });
}

/** Animate key figures from the value last shown to the new one (skipped for reduced motion). */
function countUps(root) {
  root.querySelectorAll('[data-count]').forEach((el) => {
    const to = toNum(el.dataset.count), key = el.dataset.countKey || '', fmt = el.dataset.fmt === 'money' ? money : money0;
    const from = key in S.counts ? S.counts[key] : 0;
    S.counts[key] = to;
    if (reducedMotion() || Math.abs(to - from) < 1) { el.textContent = fmt(to); return; }
    el.textContent = fmt(from);
    const t0 = performance.now(), dur = 750;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function homeContext() {
  const h = S.data.home, act = activePlan(), proj = plans().proj;
  const expenses = h.monthlyExpenses == null ? defaultMonthlyExpenses(S.data) : h.monthlyExpenses;
  const otherDebt = r2(unpaid().reduce((t, d) => t + Math.min(d.minPayment, d.balance), 0));
  const hasPlan = unpaid().length && act.ok && S.data.budget.debtPerPaycheck > 0;
  const points = hasPlan ? proj : [{ date: todayISO(), debt: 0, hysa: S.data.savings.balance }];
  const debtFree = hasPlan ? act.debtFree : todayISO();
  const at = (price) => {
    if (!(price > 0)) return null;
    const need = cashToClose(price, h, expenses);
    const ready = homeReadyDate({ points, debtFree, apy: S.data.savings.apy, monthlyContribution: monthlySavingsContribution(), freedMonthly: hasPlan ? freedMonthlyFrom(S.data) : 0, target: need.total });
    return { price, need, ready, pay: housingPayment(price, h) };
  };
  const lo = at(h.priceMin), hi = at(h.priceMax && h.priceMax !== h.priceMin ? h.priceMax : null);
  const gross = toNum(h.grossIncomeYr) / 12;
  const dti = lo && gross > 0 && h.ratePct != null ? ((lo.pay.total + otherDebt) / gross) * 100 : null;
  return { h, expenses, otherDebt, hasPlan, debtFree, lo, hi, dti, need: lo ? lo.need : null, now: gross > 0 && h.ratePct != null ? affordability(h, otherDebt) : null, after: gross > 0 && h.ratePct != null ? affordability(h, 0) : null };
}

}

/** Diverging bar chart: assets above the baseline, liabilities below, one column per month. */
function assetLiabChart(id, rows) {
  if (!rows.length) return '<p class="muted small">Not enough data yet.</p>';
  const W = 340, H = 190, L = 44, R = 8, T = 10, B = 22;
  const maxA = Math.max(1, ...rows.map((r) => r.assets)), maxL = Math.max(1, ...rows.map((r) => r.liabilities));
  const span = maxA + maxL, y0 = T + (maxA / span) * (H - T - B), scale = (H - T - B) / span;
  const n = rows.length, slot = (W - L - R) / n, bw = Math.max(6, Math.min(28, slot * 0.6));
  const fmtY = (v) => (Math.abs(v) >= 1000 ? moneyK(v) : money0(v));
  const cols = rows.map((r, i) => {
    const x = L + slot * i + (slot - bw) / 2, ha = r.assets * scale, hl = r.liabilities * scale;
    return `<rect x="${x.toFixed(1)}" y="${(y0 - ha).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, ha - 1).toFixed(1)}" rx="3" fill="var(--s-asset)"/>
      <rect x="${x.toFixed(1)}" y="${(y0 + 1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, hl - 1).toFixed(1)}" rx="3" fill="var(--s-liab)"/>
      <rect class="bh" data-i="${i}" x="${(L + slot * i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}" fill="transparent"/>`;
  }).join('');
  const labels = rows.map((r, i) => (n <= 6 || i % Math.ceil(n / 6) === 0 || i === n - 1) ? `<text x="${(L + slot * i + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">${esc(r.label)}</text>` : '').join('');
  CHARTS[id] = { type: 'bars', rows, W, L, slot };
  return `<div class="legend"><span><i class="box" style="background:var(--s-asset)"></i>Assets</span><span><i class="box" style="background:var(--s-liab)"></i>Liabilities</span></div>
    <div class="chart-wrap" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Assets and liabilities by month">
      <text x="${L - 6}" y="${(T + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">${fmtY(maxA)}</text>
      <text x="${L - 6}" y="${(y0 + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">$0</text>
      <text x="${L - 6}" y="${(H - B).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="DM Mono, monospace">−${fmtY(maxL)}</text>
      <line x1="${L}" x2="${W - R}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--line-strong)"/>
      ${cols}${labels}
    </svg><div class="tip hidden"></div></div>`;
}

/* ---------- housekeeping: runs only after a successful sync, so it never races a newer cloud copy ---------- */
function housekeeping() {
  if (!S.user) return;
  const now = new Date().toISOString();
  let changed = ensureMonthlySummary(S.data, now);
  if (ensurePaydayChecklist(now)) changed = true;
  if (rollRenewals(S.data, todayISO())) changed = true;
  if (!S.data.nwMilestonesInit) { checkNetWorthMilestones(S.data, now, true); changed = true; }
  if ((S.data.accounts.length || S.data.debts.length || S.data.savings.balance > 0) && !S.data.netWorthHistory.some((x) => x.month === monthOf(now))) { recordNetWorthSnapshot(S.data, now); changed = true; }
  if (changed) {
    const editing = isEditing();
    commit({ noRender: editing });
    if (editing) S.pendingRender = true;
  }
  if (!S.obChecked) { S.obChecked = true; setTimeout(maybeOnboard, 600); }
}
/** Create the checklist for the most recent payday (today or past) once, from the plan as of that payday. */
function ensurePaydayChecklist(now) {
  const b = S.data.budget, today = todayISO();
  let changed = false;
  if (!S.data.checklistSince) { S.data.checklistSince = today; changed = true; }   // no back-filled checklists from before this feature existed
  if (!(b.debtPerPaycheck > 0 || b.savingsPerPaycheck > 0 || b.rentReserve > 0)) return changed;
  const pd = lastPaydayOnOrBefore(b.payAnchor, b.frequency, parseISO(today));
  if (!pd) return changed;
  const iso = toISO(pd);
  if (iso < S.data.checklistSince || S.data.payChecklists.some((c) => c.date === iso)) return changed;
  const sim = simulatePayoff(S.data.debts, Object.assign(planOpts(0), { today: iso, payAnchor: b.frequency === 'semimonthly' ? b.payAnchor : iso, skipThrough: null }));
  const pc = sim.paychecks.find((x) => x.date === iso) || null;
  const list = buildChecklist(pc, b, iso, now);
  if (!list.items.length) return changed;
  S.data.payChecklists.unshift(list);
  S.data.payChecklists.sort((a, c) => (a.date < c.date ? 1 : -1));
  if (S.data.payChecklists.length > 60) S.data.payChecklists.length = 60;
  return true;
}

let driftCache = { key: '' };
/** This month's new card spending vs. allowance, with the days each overage pushes the debt-free date. */
function driftInfo() {
  const month = monthOf(new Date().toISOString());
  const key = JSON.stringify([S.data.drift.filter((e) => e.month === month), S.data.debts, S.data.budget, S.data.strategy, S.data.customOrder, S.data.activePlan, S.data.payChecklists.map((c) => c.date), todayISO()]);
  if (driftCache.key === key) return driftCache.v;
  const sum = driftSummary(S.data, month);
  const opts = planOpts(S.data.activePlan === 'B' ? S.data.budget.lumpSum : 0);
  const all = {};
  sum.byCard.forEach((c) => { if (c.excess > 0) all[c.debtId] = c.excess; c.days = c.excess > 0 ? driftDelayDays(S.data.debts, opts, { [c.debtId]: c.excess }) : 0; });
  sum.days = sum.excess > 0 ? driftDelayDays(S.data.debts, opts, all) : 0;
  driftCache = { key, v: sum };
  return sum;
}

/** Paydays and card due dates in the next `days` days, with amounts from the active plan. */
function upcomingItems(days = 14, withSubs = true) {
  const today = parseISO(todayISO()), end = addDays(today, days);
  const act = activePlan(), b = S.data.budget;
  const items = [];
  let pd = firstPaycheckOnOrAfter(b.payAnchor, b.frequency, today);
  const anchorDay = (parseISO(b.payAnchor) || pd).getDate();
  while (pd <= end) {
    const iso = toISO(pd);
    const pc = act.paychecks.find((p) => p.date === iso);
    const detail = pc && pc.allocations.length ? pc.allocations.map((a) => `${a.name} ${money0(a.amount)}${a.buffer > 0 ? ' ⚠' : ''}`).join(' · ') : '';
    items.push({ kind: 'pay', date: iso, title: 'Payday', detail, amount: pc ? money(pc.toDebt) : (b.takeHome > 0 ? money(b.takeHome) : ''), sub: pc ? 'to debt' : (b.takeHome > 0 ? 'take-home' : '') });
    pd = nextPaycheck(pd, b.frequency, anchorDay);
  }
  for (const d of unpaid()) {
    if (!d.dueDay) continue;
    const due = nextDueDate(d.dueDay, today);
    if (due > end) continue;
    const iso = toISO(due), mk = monthKey(due);
    let planned = act.paychecks.filter((p) => monthKey(parseISO(p.date)) === mk)
      .reduce((s, p) => s + (p.allocations.find((a) => a.id === d.id) || { amount: 0 }).amount, 0);
    if (act.lump && monthKey(parseISO(act.lump.date)) === mk) planned += (act.lump.allocations.find((a) => a.id === d.id) || { amount: 0 }).amount;
    items.push({ kind: 'due', date: iso, title: `${d.name} due`, detail: planned > 0 ? `plan pays ${money(r2(planned))} this month` : 'not in this month\'s plan', amount: money(Math.min(d.minPayment, d.balance)), sub: 'min due' });
  }
  if (withSubs) items.push(...renewalItems(days));
  return items.sort((a, c) => (a.date < c.date ? -1 : a.date > c.date ? 1 : a.kind === 'pay' ? -1 : 1));
}

function wireOrderDrag() {
  const list = $('#orderList'); if (!list) return;
  let dragId = null;
  list.querySelectorAll('li').forEach((li) => {
    li.addEventListener('dragstart', (e) => { dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { /* older browsers */ } });
    li.addEventListener('dragend', () => { li.classList.remove('dragging'); list.querySelectorAll('.over').forEach((x) => x.classList.remove('over')); });
    li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('over'); });
    li.addEventListener('dragleave', () => li.classList.remove('over'));
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = li.dataset.id;
      if (!dragId || dragId === target) return;
      const orig = effectiveCustomOrder();
      const ids = orig.filter((x) => x !== dragId);
      ids.splice(ids.indexOf(target) + (orig.indexOf(dragId) < orig.indexOf(target) ? 1 : 0), 0, dragId);
      S.data.customOrder = ids; commit();
    });
  });
}

function historyHTML(limit) {
  const h = S.data.history;
  if (!h.length) return '<p class="muted small">No activity yet. Log a payment, update a balance, or do a check-in.</p>';
  const items = (limit ? h.slice(0, limit) : h).map((e) => {
    let what = '', amt = '', sub = '';
    if (e.kind === 'payment') { what = `Payment · ${esc(e.debtName)}${e.source === 'payday' ? ' · payday' : ''}`; amt = `<span class="amt pos">−${money(e.amount)}</span>`; }
    else if (e.kind === 'balance') { const diff = r2(e.after - e.before); what = `Balance update · ${esc(e.debtName)}`; amt = `<span class="amt ${diff <= 0 ? 'pos' : 'neg'}">${diff <= 0 ? '−' : '+'}${money(Math.abs(diff))}</span>`; }
    else if (e.kind === 'paid') { what = `PAID OFF · ${esc(e.debtName)}`; amt = `<span class="amt pos">${money(e.amount || 0)}</span>`; }
    else if (e.kind === 'added') { what = `Added · ${esc(e.debtName)}`; amt = `<span class="amt">${money(e.after)}</span>`; }
    else if (e.kind === 'removed') { what = `Removed · ${esc(e.debtName)}`; }
    else if (e.kind === 'savings') { what = `HYSA deposit${e.source === 'payday' ? ' · payday' : ''}`; amt = `<span class="amt" style="color:var(--save)">+${money(e.amount)}</span>`; sub = `<div class="when num">now ${money(e.after)}</div>`; }
    else if (e.kind === 'account') { const diff = r2(e.after - e.before); what = `Account · ${esc(e.name)}`; amt = `<span class="amt">${diff >= 0 ? '+' : '−'}${money(Math.abs(diff))}</span>`; }
    else if (e.kind === 'checkin') { what = 'Monthly check-in'; amt = `<span class="amt">${money(e.after)}</span>`; sub = `<div class="when num">HYSA ${money(e.hysa)}</div>`; }
    else { what = esc(e.kind); }
    if (!sub && e.after != null && e.kind !== 'added') sub = `<div class="when num">now ${money(e.after)}</div>`;
    return `<li><div><div>${what}</div><div class="when">${esc(fmtStamp(e.at))}</div></div><div>${amt}${sub}</div></li>`;
  }).join('');
  return `<ul class="hist">${items}</ul>`;
}

/** Freeze the active plan's month-by-month projection so later check-ins can be compared to it. */
function snapshotBaseline() {
  const { proj } = plans();
  S.data.baseline = { setAt: new Date().toISOString(), plan: S.data.activePlan, strategy: S.data.strategy, points: proj.slice(0, 361) };
}
function saveCheckin() {
  const dr = checkinDraft();
  const date = parseISO(dr.date) ? dr.date : todayISO();
  if (!S.data.baseline) snapshotBaseline();   // first check-in: compare against the plan as it stood before it
  const balances = {};
  const newlyPaid = [], drifted = [];
  for (const d of unpaid()) {
    const raw = dr.balances[d.id];
    const v = r2(Math.max(0, toNum(raw != null && raw !== '' ? raw : d.balance)));
    balances[d.id] = v;
    if (recordBalance(S.data, d, v, undefined, 'checkin')) drifted.push(d.name);
    if (v <= 0) newlyPaid.push(d);
  }
  const hysa = r2(Math.max(0, toNum(dr.hysa != null && dr.hysa !== '' ? dr.hysa : S.data.savings.balance)));
  S.data.savings.balance = hysa;
  newlyPaid.forEach((d) => { d.paid = true; d.paidAt = new Date().toISOString(); logHistory({ kind: 'paid', debtId: d.id, debtName: d.name, amount: 0, before: 0, after: 0 }); });
  const totalDebt = r2(S.data.debts.reduce((s, d) => s + (d.paid ? 0 : d.balance), 0));
  S.data.checkins = S.data.checkins.filter((c) => c.date !== date);
  S.data.checkins.push({ id: uid(), date, at: new Date().toISOString(), balances, totalDebt, hysa });
  S.data.checkins.sort((a, b) => (a.date < b.date ? -1 : 1));
  const nowISO = new Date().toISOString();
  for (const a of S.data.accounts.filter((x) => !x.archived)) {
    const raw = dr.accounts[a.id];
    const v = r2(Math.max(0, toNum(raw != null && raw !== '' ? raw : a.balance)));
    if (Math.abs(v - a.balance) > 0.004) logHistory({ kind: 'account', accountId: a.id, name: a.name, before: a.balance, after: v });
    a.balance = v; a.updatedAt = nowISO;
  }
  logHistory({ kind: 'checkin', after: totalDebt, hysa });
  recordNetWorthSnapshot(S.data, nowISO);

/* ---------- calendar export ---------- */
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
/** Fold lines at 75 octets (RFC 5545) without splitting multi-byte characters. */
function icsFold(line) {
  const enc = new TextEncoder();
  const out = [];
  let cur = '', bytes = 0;
  for (const ch of line) {
    const n = enc.encode(ch).length;
    if (bytes + n > 74) { out.push(cur); cur = ' '; bytes = 1; }
    cur += ch; bytes += n;
  }
  out.push(cur);
  return out.join('\r\n');
}
function monthDayRule(day) {
  if (day <= 28) return `BYMONTHDAY=${day}`;
  const days = [];
  for (let i = 28; i <= day; i++) days.push(i);
  return `BYMONTHDAY=${days.join(',')};BYSETPOS=-1`;   // the day, or the month's last day if it's shorter
}
function buildICS() {
  const b = S.data.budget, act = activePlan();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const dt = (iso) => iso.replace(/-/g, '');
  const events = [];
  const add = (id, startISO, summary, desc, rrule, alarmDays) => {
    events.push(['BEGIN:VEVENT', `UID:${id}@debt-tracker`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dt(startISO)}`, `DTEND;VALUE=DATE:${dt(toISO(addDays(parseISO(startISO), 1)))}`,
      `SUMMARY:${icsEscape(summary)}`, `DESCRIPTION:${icsEscape(desc)}`, rrule ? `RRULE:${rrule}` : null,
      ...(alarmDays ? ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(summary)}`, `TRIGGER:-P${alarmDays}D`, 'END:VALARM'] : []),
      'END:VEVENT'].filter(Boolean));
  };
  const today = parseISO(todayISO());
  const firstPay = firstPaycheckOnOrAfter(b.payAnchor, b.frequency, today);
  const payRule = { weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', semimonthly: 'FREQ=MONTHLY;BYMONTHDAY=1,15', monthly: 'FREQ=MONTHLY;' + monthDayRule(firstPay.getDate()) }[b.frequency];
  const split = budgetItems().filter((i) => i.amount > 0).map((i) => `${i.name}: ${money(i.amount)}`).join('\n');
  add('payday', toISO(firstPay), '💵 Payday', `Take-home ${money(b.takeHome)}\n${split}\nOpen Money HQ → Debt → Paychecks to see exactly which card gets what.\n${SITE_URL}`, payRule, 0);
  for (const d of unpaid()) {
    if (!d.dueDay) continue;
    const first = nextDueDate(d.dueDay, today);
    const po = act.payoffs.find((p) => p.id === d.id);
    const until = po ? `;UNTIL=${dt(toISO(nextDueDate(d.dueDay, parseISO(po.date))))}` : '';
    add(`due-${d.id}`, toISO(first), `📅 ${d.name} payment due`,
      `Minimum ${money(d.minPayment)}.${po ? ` Planned payoff: ${fmtMonth(po.date)}.` : ''}\nCheck Money HQ for this month's planned amount.\n${SITE_URL}`,
      `FREQ=MONTHLY;${monthDayRule(d.dueDay)}${until}`, 2);
  }
  for (const x of activeSubs(S.data.subscriptions)) {
    const rule = { weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY;' + monthDayRule(x.anchorDay), quarterly: 'FREQ=MONTHLY;INTERVAL=3;' + monthDayRule(x.anchorDay), yearly: 'FREQ=YEARLY' }[x.cycle];
    const card = S.data.debts.find((d) => d.id === x.cardId);
    add(`sub-${x.id}`, x.nextRenewal, `🔁 ${x.name} renews`, `${money(x.amount)} ${CYCLES[x.cycle].label.toLowerCase()} (${money0(subYearly(x))}/yr) · ${x.category}${card ? ` · billed to ${card.name}` : ''}\n${SITE_URL}`, rule, 1);
  }
  for (const c of S.data.wallet.filter((x) => !x.archived)) {
    for (const cr of c.credits) {
      if (!(cr.amount > 0)) continue;
      const p = creditPeriod(cr, todayISO());
      const rule = { monthly: 'FREQ=MONTHLY;BYMONTHDAY=1', quarterly: 'FREQ=MONTHLY;INTERVAL=3;BYMONTHDAY=1', semiannual: 'FREQ=MONTHLY;INTERVAL=6;BYMONTHDAY=1', annual: 'FREQ=YEARLY', calendarYear: 'FREQ=YEARLY' }[cr.period];
      add(`credit-${c.id}-${cr.id}`, p.reset, `🎁 ${c.name}: ${cr.name} credit resets`, `A new ${money(cr.amount)} ${CREDIT_PERIODS[cr.period].label.toLowerCase()} credit starts today. Use the last one before this date.\n${SITE_URL}`, rule, 3);
    }
  }
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Money HQ//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Money HQ', ...events.flat(), 'END:VCALENDAR'];
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function downloadFile(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
